name: Build Rev6 candidate once

on:
  push:
    paths:
      - '.github/workflows/rev6-build-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct exact anonymous Rev6 candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          exp = Path('experiments/01-vanishing-absorber')
          parts = sorted((exp / 'manuscript_history').glob('MANUSCRIPT_REV6_ANON_2026-08-11.tex.gz.b64.part*'))
          if len(parts) != 6:
              raise SystemExit(f'expected 6 Rev6 snapshot parts, found {len(parts)}')
          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
          packed = base64.b64decode(encoded, validate=True)
          packed_hash = hashlib.sha256(packed).hexdigest()
          if packed_hash != 'aa7ab9e3271599bf9cdaa5ef37618cb2b9757ee0e08c867303a83e06e61adb8e':
              raise SystemExit(f'Rev6 gzip hash mismatch: {packed_hash}')
          source = gzip.decompress(packed)
          source_hash = hashlib.sha256(source).hexdigest()
          if source_hash != '2f8f6c22b64d89f7237a3053663fc500f97574c75a0c60489bb7f19925f112b4':
              raise SystemExit(f'Rev6 source hash mismatch: {source_hash}')
          text = source.decode('utf-8')
          if len(text.splitlines()) != 924:
              raise SystemExit('Rev6 line-count mismatch')
          if r'\author{Anonymous}' not in text or 'pdfauthor={Anonymous}' not in text:
              raise SystemExit('Rev6 anonymous author metadata missing')
          out = exp / 'MANUSCRIPT_REV6_ANON_2026-08-11.tex'
          out.write_bytes(source)
          print('Rev6 source verified:', source_hash)
          PY

      - name: Run Rev6 mathematical regression
        run: |
          python -m pip install --disable-pip-version-check -q numpy
          python experiments/01-vanishing-absorber/numerics/rev6_review_regression.py

      - name: Commit exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/01-vanishing-absorber/MANUSCRIPT_REV6_ANON_2026-08-11.tex
          if git diff --cached --quiet; then
            echo 'Exact Rev6 candidate already committed.'
            exit 0
          fi
          git commit -m 'Add exact anonymous Rev6 manuscript candidate'
          git push
