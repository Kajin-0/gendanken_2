name: Paper 02 Rev3 canonicalization gate

on:
  push:
    branches:
      - agent/publication-mining-roadmap
    paths:
      - 'experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_REV3_ANON_2026-08-15.tex'
      - 'experiments/01-vanishing-absorber/PAPER02_REFERENCES_REV2.bib'
      - 'experiments/01-vanishing-absorber/PAPER02_SAME_FREQUENCY_STATISTICAL_SNIPPET.tex'
      - '.github/workflows/paper02-rev3-canonicalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical and plotting dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy matplotlib
      - name: Regenerate canonical figure data and vector panels
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python paper02_independent_velocity_profiles.py
          python paper02_kernel_tail_ablation.py
          python paper02_bias_bound_linearization.py
          python paper02_end_to_end_rejection_snr.py
          python paper02_build_figure_bundle.py
      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-extra texlive-publishers texlive-science poppler-utils
      - name: Compile Rev3 independently
        working-directory: experiments/01-vanishing-absorber
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error PAPER02_MANUSCRIPT_REV3_ANON_2026-08-15.tex
      - name: Check unresolved citations and references
        working-directory: experiments/01-vanishing-absorber
        run: |
          if grep -E "LaTeX Warning: (Citation|Reference).*undefined|There were undefined references" PAPER02_MANUSCRIPT_REV3_ANON_2026-08-15.log; then
            echo 'Unresolved citation/reference detected.'
            exit 1
          fi
      - name: Check figure files referenced by manuscript exist
        working-directory: experiments/01-vanishing-absorber
        run: |
          for f in \
            numerics/paper02_figures/fig1_generation_kernels.pdf \
            numerics/paper02_figures/fig2_apparent_diffusion_velocity_profiles.pdf \
            numerics/paper02_figures/fig3_tail_ablation.pdf \
            numerics/paper02_figures/fig3b_remote_overlap.pdf \
            numerics/paper02_figures/fig4_bias_law_validation.pdf \
            numerics/paper02_figures/fig5_required_snr_vs_bandwidth.pdf \
            numerics/paper02_figures/fig5b_refitted_diffusion_vs_bandwidth.pdf; do
              test -s "$f" || { echo "Missing figure: $f"; exit 1; }
          done
      - name: Write compile report and current pointer
        working-directory: experiments/01-vanishing-absorber
        shell: bash
        run: |
          PAGES=$(pdfinfo PAPER02_MANUSCRIPT_REV3_ANON_2026-08-15.pdf | awk -F: '/^Pages/{gsub(/ /,"",$2);print $2}')
          PDFSHA=$(sha256sum PAPER02_MANUSCRIPT_REV3_ANON_2026-08-15.pdf | awk '{print $1}')
          SRCSHA=$(sha256sum PAPER02_MANUSCRIPT_REV3_ANON_2026-08-15.tex | awk '{print $1}')
          BIBSHA=$(sha256sum PAPER02_REFERENCES_REV2.bib | awk '{print $1}')
          cat > PAPER02_MANUSCRIPT_REV3_COMPILE_REPORT_2026-08-15.md <<EOF
          # Paper 02 — Rev. 3 Compile Report

          **Date:** 2026-08-15  
          **Status:** **FIGURE-BEARING COMPILE PASSED / REFERENCES RESOLVED / CANONICALIZATION GATE PASSED**

          Source:

          \`\`\`text
          PAPER02_MANUSCRIPT_REV3_ANON_2026-08-15.tex
          \`\`\`

          Bibliography:

          \`\`\`text
          PAPER02_REFERENCES_REV2.bib
          \`\`\`

          Validation:

          \`\`\`text
          GitHub Actions run       $GITHUB_RUN_ID
          workflow commit          $GITHUB_SHA
          compiled pages           $PAGES
          source SHA-256           $SRCSHA
          bibliography SHA-256     $BIBSHA
          compiled PDF SHA-256     $PDFSHA
          \`\`\`

          Before compilation, all canonical numerical datasets and seven vector figure panels were regenerated from executable branch source. The explicit unresolved-reference gate and figure-existence gate passed.

          Rev. 3 changes Rev. 2 only by integrating the canonical regenerated figures and adding a reproducibility statement for the exact conditional kernel method. No theorem or numerical result is intentionally changed.

          The compiled PDF and regenerated figures are stored as GitHub Actions artifacts rather than committed binaries.
          EOF

          cat > PAPER02_MANUSCRIPT_CURRENT.md <<EOF
          # Paper 02 — Canonical Working Manuscript

          **Date:** 2026-08-15  
          **Status:** **ANONYMOUS REV. 3 / FIGURE-BEARING / ADVERSARIALLY REPAIRED / COMPILE-VALIDATED / PRE-SUBMISSION HARDENING**

          ## Canonical source

          \`\`\`text
          PAPER02_MANUSCRIPT_REV3_ANON_2026-08-15.tex
          \`\`\`

          Bibliography:

          \`\`\`text
          PAPER02_REFERENCES_REV2.bib
          \`\`\`

          Compiled pages: **$PAGES**

          Source SHA-256:

          \`\`\`text
          $SRCSHA
          \`\`\`

          Compile report:

          \`\`\`text
          PAPER02_MANUSCRIPT_REV3_COMPILE_REPORT_2026-08-15.md
          \`\`\`

          Validation run:

          \`\`\`text
          $GITHUB_RUN_ID
          \`\`\`

          ## Revision boundary

          Rev. 1 and Rev. 2 remain frozen provenance. Rev. 3 is a manuscript-hardening revision: it integrates figures regenerated from the checked numerical workflows and adds explicit executable-to-method traceability for the conditional optical kernels. It does not authorize new scientific claims.

          ## Priority posture

          \`\`\`text
          DISTINCT COMBINATION SUPPORTED BY FOCUSED AUDIT
          NO SUPERLATIVE PRIORITY CLAIM
          \`\`\`

          ## Remaining submission blockers

          1. publisher-level bibliography metadata verification and final citation-chain audit;
          2. submission-grade Supplemental Methods for the conditional optical kernel construction and numerical convergence;
          3. final hostile review of the compiled figure-bearing Rev. 3;
          4. journal-format adaptation only after the scientific review is closed.

          Any material correction must create Rev. 4 rather than overwrite Rev. 3.
          EOF
      - name: Persist canonicalization records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_REV3_COMPILE_REPORT_2026-08-15.md
          git add experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_CURRENT.md
          if git diff --cached --quiet; then
            echo 'Canonicalization records already current.'
          else
            git commit -m 'Canonicalize Paper 02 Rev3'
            git push
          fi
      - name: Upload canonical Rev3 PDF and figures
        uses: actions/upload-artifact@v4
        with:
          name: paper02-manuscript-rev3-canonical
          path: |
            experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_REV3_ANON_2026-08-15.pdf
            experiments/01-vanishing-absorber/numerics/paper02_figures/*.pdf
            experiments/01-vanishing-absorber/numerics/paper02_figures/*.png
          if-no-files-found: error
