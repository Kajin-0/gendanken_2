name: Build Rev4 candidate once

on:
  push:
    paths:
      - '.github/workflows/rev4-build-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct exact anonymous Rev4 candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          exp = Path('experiments/01-vanishing-absorber')
          parts = sorted((exp / 'manuscript_history').glob('MANUSCRIPT_REV4_ANON_2026-08-11.tex.gz.b64.part*'))
          if len(parts) != 3:
              raise SystemExit(f'expected 3 Rev4 snapshot parts, found {len(parts)}')
          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
          packed = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(packed).hexdigest() != 'fad3aeee778de42a7c9de278abec5676d6fb3d0effebd4994c7bbdb0950a3f68':
              raise SystemExit('Rev4 gzip hash mismatch')
          source = gzip.decompress(packed)
          if hashlib.sha256(source).hexdigest() != '9da8c6094a58109873382b6b3c73c519b26f519e327f5ec8058009bc4896df00':
              raise SystemExit('Rev4 source hash mismatch')
          text = source.decode('utf-8')
          if len(text.splitlines()) != 817:
              raise SystemExit('Rev4 line-count mismatch')
          if r'\author{Anonymous}' not in text or 'pdfauthor={Anonymous}' not in text:
              raise SystemExit('Rev4 anonymous author metadata missing')
          out = exp / 'MANUSCRIPT_REV4_ANON_2026-08-11.tex'
          out.write_bytes(source)
          print('Rev4 source verified:', hashlib.sha256(source).hexdigest())
          PY

      - name: Run Rev4 mathematical regression
        run: |
          python -m pip install --disable-pip-version-check -q numpy
          python experiments/01-vanishing-absorber/numerics/rev4_critique_regression.py

      - name: Commit exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/01-vanishing-absorber/MANUSCRIPT_REV4_ANON_2026-08-11.tex
          if git diff --cached --quiet; then
            echo 'Exact Rev4 candidate already committed.'
            exit 0
          fi
          git commit -m 'Add exact anonymous Rev4 manuscript candidate'
          git push
