name: One-time privacy migration

on:
  push:
    branches:
      - agent/privacy-first-pseudonymous-manuscript

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply pseudonymity migration
        run: python tools/privacy_migrate_repository.py
      - name: Verify no legacy author identity remains in live tree
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -F 'Terence Fisher' -- .; then
            echo 'Legacy author identity remains in live tree.' >&2
            exit 1
          fi
          if find experiments/01-vanishing-absorber/manuscript_history -maxdepth 1 -type f -name 'Fisher_*' | grep -q .; then
            echo 'Identity-bearing snapshot filename remains.' >&2
            exit 1
          fi
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name 'repository-privacy-migration'
          git config user.email 'privacy-migration@users.noreply.github.com'
          git add -A
          git commit -m 'Make pseudonymity the canonical default'
          git push origin HEAD:agent/privacy-first-pseudonymous-manuscript
