name: Paper 02 manuscript Rev1

on:
  push:
    branches:
      - agent/publication-mining-roadmap
    paths:
      - 'experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_REV1_ANON_2026-08-15.tex'
      - 'experiments/01-vanishing-absorber/PAPER02_REFERENCES.bib'
      - '.github/workflows/paper02-manuscript-rev1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-extra texlive-publishers texlive-science
      - name: Compile manuscript
        working-directory: experiments/01-vanishing-absorber
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error PAPER02_MANUSCRIPT_REV1_ANON_2026-08-15.tex
      - name: Check unresolved references
        working-directory: experiments/01-vanishing-absorber
        run: |
          if grep -E "LaTeX Warning: (Citation|Reference).*undefined|There were undefined references" PAPER02_MANUSCRIPT_REV1_ANON_2026-08-15.log; then
            echo 'Unresolved citation/reference detected.'
            exit 1
          fi
      - name: Report PDF
        working-directory: experiments/01-vanishing-absorber
        run: |
          pdfinfo PAPER02_MANUSCRIPT_REV1_ANON_2026-08-15.pdf | grep -E 'Pages|Title|Author' || true
          sha256sum PAPER02_MANUSCRIPT_REV1_ANON_2026-08-15.pdf
      - name: Upload manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper02-manuscript-rev1
          path: experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_REV1_ANON_2026-08-15.pdf
          if-no-files-found: error
