name: Paper 03 coplanar 500 MHz bootstrap optimizer repair

on:
  pull_request:
    paths:
      - 'experiments/01-vanishing-absorber/numerics/paper03_second_geometry_bootstrap_500_repair.py'
      - '.github/workflows/paper03-second-geometry-bootstrap-500-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-500-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run frozen 500 MHz bootstrap with optimizer-only repair
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python -m py_compile paper03_second_geometry_bootstrap_500_repair.py
          python paper03_second_geometry_bootstrap_500_repair.py
      - name: Verify unchanged statistical contract and optimizer integrity
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python - <<'PY'
          import json
          d=json.load(open('paper03_second_geometry_bootstrap_500_repair.json'))
          assert d['science_interpretation_ready'] is False
          assert d['bootstrap']=={'alpha':0.002699796063260207,'target_power':0.9,'n_null':4000,'n_alt':2000,'snr_offsets_db':[-4.0,-2.0,0.0,2.0,4.0]}
          assert d['rf_gate']['frequency_hz']==500000000.0
          for c in d['rf_gate']['fast_refit_spot_checks_at_analytic_snr'].values(): assert c['max_fast_over_full_residual_norm_ratio']<=1.001
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper03-second-geometry-bootstrap-500-repair
          path: experiments/01-vanishing-absorber/numerics/paper03_second_geometry_bootstrap_500_repair.json
          if-no-files-found: error
