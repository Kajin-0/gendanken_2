name: Paper 02 mean-preserving tail ablation

on:
  push:
    branches:
      - agent/publication-mining-roadmap
    paths:
      - 'experiments/01-vanishing-absorber/numerics/paper02_mean_preserving_tail_ablation.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_kernel_aware_depletion_frequency_law.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_geometry_parameter_sweep.py'
      - 'experiments/01-vanishing-absorber/numerics/realistic_geometry_closure_stress.py'
      - '.github/workflows/paper02-mean-preserving-tail-ablation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mean-preserving-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run mean-preserving control
        working-directory: experiments/01-vanishing-absorber/numerics
        run: python paper02_mean_preserving_tail_ablation.py
      - name: Print summary
        working-directory: experiments/01-vanishing-absorber/numerics
        run: cat paper02_mean_preserving_tail_ablation_summary.json
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: paper02-mean-preserving-tail-ablation
          path: |
            experiments/01-vanishing-absorber/numerics/paper02_mean_preserving_tail_ablation_results.csv
            experiments/01-vanishing-absorber/numerics/paper02_mean_preserving_tail_ablation_metadata.csv
            experiments/01-vanishing-absorber/numerics/paper02_mean_preserving_tail_ablation_summary.json
          if-no-files-found: error
