name: Paper 03 second-geometry hierarchy

on:
  pull_request:
    paths:
      - 'experiments/01-vanishing-absorber/PAPER03_SECOND_GEOMETRY_ANALYSIS_LOCK_2026-08-17.md'
      - 'experiments/01-vanishing-absorber/numerics/paper03_second_geometry_hierarchy.py'
      - 'experiments/01-vanishing-absorber/numerics/paper03_second_geometry_bootstrap_shard.py'
      - '.github/workflows/paper03-second-geometry-hierarchy.yml'
  push:
    branches: [agent/paper03-combined-physics]
    paths:
      - 'experiments/01-vanishing-absorber/PAPER03_SECOND_GEOMETRY_ANALYSIS_LOCK_2026-08-17.md'
      - 'experiments/01-vanishing-absorber/numerics/paper03_second_geometry_hierarchy.py'
      - 'experiments/01-vanishing-absorber/numerics/paper03_second_geometry_bootstrap_shard.py'
      - '.github/workflows/paper03-second-geometry-hierarchy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-order-root-law:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run frozen coplanar model-order/root-law diagnostic
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python -m py_compile paper03_second_geometry_hierarchy.py
          python paper03_second_geometry_hierarchy.py --output paper03_second_geometry_hierarchy.json
      - uses: actions/upload-artifact@v4
        with:
          name: paper03-second-geometry-hierarchy
          path: experiments/01-vanishing-absorber/numerics/paper03_second_geometry_hierarchy.json
          if-no-files-found: error

  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rf_index: 1, rf_label: 100MHz}
          - {rf_index: 2, rf_label: 500MHz}
          - {rf_index: 3, rf_label: 1GHz}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run frozen coplanar bootstrap shard
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python -m py_compile paper03_second_geometry_bootstrap_shard.py
          python paper03_second_geometry_bootstrap_shard.py --rf-index ${{ matrix.rf_index }} --output paper03_second_geometry_bootstrap_${{ matrix.rf_label }}.json
      - name: Verify non-claim and locked statistical structure
        working-directory: experiments/01-vanishing-absorber/numerics
        env: {RF_LABEL: '${{ matrix.rf_label }}'}
        run: |
          python - <<'PY'
          import json,os
          r=json.load(open(f"paper03_second_geometry_bootstrap_{os.environ['RF_LABEL']}.json"))
          assert r['science_interpretation_ready'] is False
          assert r['bootstrap']['alpha']==0.002699796063260207
          assert r['bootstrap']['target_power']==0.90
          assert r['bootstrap']['n_null']==4000 and r['bootstrap']['n_alt']==2000
          assert r['bootstrap']['snr_offsets_db']==[-4.0,-2.0,0.0,2.0,4.0]
          for c in r['rf_gate']['fast_refit_spot_checks_at_analytic_snr'].values(): assert c['max_fast_over_full_residual_norm_ratio']<=1.001
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper03-second-geometry-bootstrap-${{ matrix.rf_label }}
          path: experiments/01-vanishing-absorber/numerics/paper03_second_geometry_bootstrap_${{ matrix.rf_label }}.json
          if-no-files-found: error
