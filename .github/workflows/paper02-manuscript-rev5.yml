name: Paper 02 manuscript Rev5 field-semantics gate

on:
  push:
    branches:
      - agent/publication-mining-roadmap
    paths:
      - 'experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_REV4_ANON_2026-08-16.tex'
      - 'experiments/01-vanishing-absorber/PAPER02_SUPPLEMENT_REV4_ANON_2026-08-16.tex'
      - 'experiments/01-vanishing-absorber/PAPER02_REFERENCES_REV4.bib'
      - 'experiments/01-vanishing-absorber/PAPER02_SAME_FREQUENCY_STATISTICAL_SNIPPET.tex'
      - 'experiments/01-vanishing-absorber/tools/build_paper02_rev5.py'
      - 'experiments/01-vanishing-absorber/numerics/results/paper02_inference_convergence_summary.json'
      - 'experiments/01-vanishing-absorber/numerics/paper02_build_figure_bundle.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_independent_velocity_profiles.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_kernel_tail_ablation.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_bias_bound_linearization.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_end_to_end_rejection_snr.py'
      - '.github/workflows/paper02-manuscript-rev5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-compile-review-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/publication-mining-roadmap
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical and plotting dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy matplotlib

      - name: Verify checked inferential convergence input
        working-directory: experiments/01-vanishing-absorber
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('numerics/results/paper02_inference_convergence_summary.json')
          x = json.loads(p.read_text())
          assert x['convergence']['overall_pass'] is True
          print(x['status'])
          PY

      - name: Regenerate canonical figure data
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python paper02_independent_velocity_profiles.py
          python paper02_kernel_tail_ablation.py
          python paper02_bias_bound_linearization.py
          python paper02_end_to_end_rejection_snr.py
          python paper02_build_figure_bundle.py

      - name: Build Rev5 from frozen Rev4 blobs
        working-directory: experiments/01-vanishing-absorber
        run: |
          python -m py_compile tools/build_paper02_rev5.py
          python tools/build_paper02_rev5.py

      - name: Guard anonymity, priority, field semantics, and statistical ordering
        working-directory: experiments/01-vanishing-absorber
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          main = Path('PAPER02_MANUSCRIPT_REV5_ANON_2026-08-16.tex').read_text()
          supp = Path('PAPER02_SUPPLEMENT_REV5_ANON_2026-08-16.tex').read_text()
          snippet = Path('PAPER02_SAME_FREQUENCY_STATISTICAL_SNIPPET.tex').read_text()

          assert main.count(r'\author{Anonymous}') == 1
          assert supp.count(r'\author{Anonymous}') == 1
          assert r"V''=2\Delta/W_d^2" in main
          assert 'characteristic curvature-field scale' in main
          assert '328.9' in main and '662.3' in main and '100.9' in main
          assert r'\frac{d^2V}{dz^2}=\frac{2\Delta}{W_d^2}' in supp
          assert '328.947' in supp and '662.281' in supp
          assert '100.877' in supp and '0.030263' in supp
          assert 'not an independently added terminal field' in main
          assert 'not an independently added terminal voltage' in supp

          obsolete = [
              'adds an electrostatic drop',
              'average added field of',
              'average added-field scale',
          ]
          for phrase in obsolete:
              assert phrase.lower() not in main.lower(), phrase
              assert phrase.lower() not in supp.lower(), phrase

          priority = [
              r'for the first time',
              r'first-ever',
              r'fundamental new mechanism',
              r'universal false diffusion',
          ]
          for pat in priority:
              assert not re.search(pat, main, re.I), pat
              assert not re.search(pat, supp, re.I), pat

          assert 'No experimental kernel calibration is performed here' in main
          assert 'D_{\mathrm{micro}}' in main
          assert 'D_{\mathrm{eff}}' in main
          assert '500' in snippet and '1000' in snippet and '100' in snippet
          print('PASS: Rev5 semantic / privacy / priority / statistical guards')
          PY

      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-extra texlive-publishers texlive-science poppler-utils

      - name: Compile Rev5 main manuscript
        working-directory: experiments/01-vanishing-absorber
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error PAPER02_MANUSCRIPT_REV5_ANON_2026-08-16.tex

      - name: Compile Rev5 Supplemental Material
        working-directory: experiments/01-vanishing-absorber
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error PAPER02_SUPPLEMENT_REV5_ANON_2026-08-16.tex

      - name: Check unresolved references and citations
        working-directory: experiments/01-vanishing-absorber
        run: |
          for log in PAPER02_MANUSCRIPT_REV5_ANON_2026-08-16.log PAPER02_SUPPLEMENT_REV5_ANON_2026-08-16.log; do
            if grep -E "LaTeX Warning: (Citation|Reference).*undefined|There were undefined references|There were undefined citations" "$log"; then
              echo "Unresolved citation/reference detected in $log"
              exit 1
            fi
          done

      - name: Report compiled artifacts
        working-directory: experiments/01-vanishing-absorber
        run: |
          pdfinfo PAPER02_MANUSCRIPT_REV5_ANON_2026-08-16.pdf | grep -E 'Pages|Title|Author' || true
          pdfinfo PAPER02_SUPPLEMENT_REV5_ANON_2026-08-16.pdf | grep -E 'Pages|Title|Author' || true
          sha256sum \
            PAPER02_MANUSCRIPT_REV5_ANON_2026-08-16.pdf \
            PAPER02_SUPPLEMENT_REV5_ANON_2026-08-16.pdf

      - name: Persist Rev5 source and supplement
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_REV5_ANON_2026-08-16.tex \
            experiments/01-vanishing-absorber/PAPER02_SUPPLEMENT_REV5_ANON_2026-08-16.tex
          if git diff --cached --quiet; then
            echo 'Rev5 sources already current.'
            exit 0
          fi
          git commit -m 'Build Paper 02 Rev5 field-semantics repair'
          branch='agent/publication-mining-roadmap'
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} lost a branch race; rebasing onto origin/${branch}."
            git fetch origin "${branch}"
            git rebase "origin/${branch}"
          done
          echo 'Unable to persist Rev5 after five push attempts.'
          exit 1

      - name: Upload Rev5 manuscript package
        uses: actions/upload-artifact@v4
        with:
          name: paper02-manuscript-rev5-package
          path: |
            experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_REV5_ANON_2026-08-16.pdf
            experiments/01-vanishing-absorber/PAPER02_SUPPLEMENT_REV5_ANON_2026-08-16.pdf
            experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_REV5_ANON_2026-08-16.tex
            experiments/01-vanishing-absorber/PAPER02_SUPPLEMENT_REV5_ANON_2026-08-16.tex
            experiments/01-vanishing-absorber/PAPER02_REFERENCES_REV4.bib
            experiments/01-vanishing-absorber/numerics/results/PAPER02_INFERENCE_CONVERGENCE.md
            experiments/01-vanishing-absorber/numerics/paper02_figures/*.pdf
          if-no-files-found: error
