name: Paper 02 manuscript Rev9 targeted full gate

on:
  push:
    branches: [agent/publication-mining-roadmap]
    paths:
      - 'experiments/01-vanishing-absorber/tools/build_paper02_rev9.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_build_fig5_rev9.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_two_carrier_exact_continuum.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_two_carrier_known_countercarrier.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_full_channel_rejection.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_exact_planar_continuum_crosscheck.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_independent_velocity_profiles.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_kernel_tail_ablation.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_bias_bound_linearization.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_end_to_end_rejection_snr.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_build_figure_bundle.py'
      - '.github/workflows/paper02-manuscript-rev9.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/publication-mining-roadmap
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy matplotlib
      - name: Recompute claim-affecting Rev9 science
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python paper02_exact_planar_continuum_crosscheck.py
          python paper02_two_carrier_exact_continuum.py
          python paper02_two_carrier_known_countercarrier.py
          python paper02_full_channel_rejection.py
      - name: Validate Rev9 scientific and reporting invariants
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python - <<'PY'
          import json, math
          e=json.load(open('results/paper02_exact_planar_continuum_crosscheck_summary.json'))
          assert abs(e['exact_continuum']['probe']['100000000']['D_eff_m2_per_s']-0.0026181645345283023)<1e-12

          p=json.load(open('results/paper02_two_carrier_exact_continuum_summary.json'))
          assert p['dc_pair_identity_max_abs_error']<=1e-12 and p['uniform_core_gate_pass']
          c=p['core_summary']
          assert c['row_count']==21 and c['identifiable_row_count']==21
          assert c['positive_D_row_count']==3
          assert abs(c['max_uniform_abs_D_m2_per_s']-6.579444100145674e-09)<1e-14
          assert abs(c['max_uniform_centered_fit_rel']-1.735154346493963e-13)<1e-17
          assert abs(c['min_heterogeneous_D_m2_per_s']-(-76785266.43217735))<1e-3
          assert abs(c['max_heterogeneous_D_m2_per_s']-0.3364135544521548)<1e-12
          assert abs(c['max_heterogeneous_centered_fit_rel']-0.00011030544664884367)<1e-12

          k=json.load(open('results/paper02_two_carrier_known_countercarrier_summary.json'))
          assert k['uniform_core_gate_pass'] and k['positive_D_core_rows']==1 and k['core_rows']==21
          core=[r for r in k['rows'] if r['core']]
          ratios=sorted(set(r['ratio'] for r in core)); freqs=sorted(set(r['frequency_hz'] for r in core))
          assert ratios==[0.1,0.25,0.5,1.0,2.0,4.0,10.0]
          assert freqs==[1e8,5e8,1e9]
          pos=[r for r in core if r['heterogeneous_positive_D']]
          assert len(pos)==1 and pos[0]['ratio']==0.1 and pos[0]['frequency_hz']==1e9
          assert abs(pos[0]['heterogeneous_D']-0.0014936279374425938)<1e-12
          expected={
            0.1:(-0.1654805779823219,-0.0034381270924471606,0.0014936279374425938,0.00036451901047076325),
            0.25:(-0.3209618858831445,-0.011336626024431312,-0.0005828194685605474,0.00012723556372518105),
            0.5:(-0.427158560363248,-0.019665613025835752,-0.0026057352203365833,0.00027572789594772315),
            1.0:(-0.46471492227059946,-0.028619369080531334,-0.004798271238483302,0.0004756281058593865),
            2.0:(-0.44927591059251937,-0.0361401063190777,-0.006730460667201866,0.00022195343829976545),
            4.0:(-0.4225694068429383,-0.041223263645914186,-0.008119257390011009,0.00017259364385114115),
            10.0:(-0.39801250897136203,-0.044820689453028716,-0.009162891375082109,0.00015245512246287495),
          }
          for ratio,vals in expected.items():
            rr=sorted([r for r in core if r['ratio']==ratio],key=lambda r:r['frequency_hz'])
            assert len(rr)==3
            for r,v in zip(rr,vals[:3]): assert abs(r['heterogeneous_D']-v)<1e-12
            assert abs(max(r['heterogeneous_centered_rel'] for r in rr)-vals[3])<1e-12

          f=json.load(open('results/paper02_full_channel_rejection_summary.json'))
          rows={int(r['max_frequency_hz']):r for r in f['rows']}
          for hz,n,rd,fd in [(10**9,6,10,46),(2*10**9,8,14,62),(3*10**9,9,16,70)]:
            r=rows[hz]; assert r['n_frequencies']==n and r['root_dof']==rd and r['full_dof']==fd
          assert abs(rows[10**9]['root_required_snr_db']-90.37011593664973)<1e-6
          assert abs(rows[10**9]['full_required_snr_db']-81.51110245352142)<1e-6
          assert abs(rows[2*10**9]['root_required_snr_db']-73.204299890682)<1e-6
          assert abs(rows[2*10**9]['full_required_snr_db']-72.27518181024443)<1e-6
          assert abs(rows[3*10**9]['root_required_snr_db']-64.21043428895433)<1e-6
          assert abs(rows[3*10**9]['full_required_snr_db']-65.00182889058803)<1e-6
          PY
      - name: Build Rev9 from frozen Rev8
        working-directory: experiments/01-vanishing-absorber
        run: |
          python -m py_compile tools/build_paper02_rev9.py
          python tools/build_paper02_rev9.py
      - name: Guard targeted referee repairs and scope
        working-directory: experiments/01-vanishing-absorber
        run: |
          python - <<'PY'
          from pathlib import Path
          m=Path('PAPER02_MANUSCRIPT_REV9_ANON_2026-08-16.tex').read_text()
          s=Path('PAPER02_SUPPLEMENT_REV9_ANON_2026-08-16.tex').read_text()
          b=Path('PAPER02_REFERENCES_REV9.bib').read_text(); t=m+s
          assert m.count(r'\author{Anonymous}')==1 and s.count(r'\author{Anonymous}')==1
          assert 'analytic continuation of the \\emph{actual} upstream solution' in m
          assert r'A=v_0/(i\omega L)' in m and r'B=C(\omega)' in m and r'r=i\omega/v_0' in m
          assert r'\nu_{\rm root}=2n-2' in m and r'\nu_{\rm full}=12n-(4n+2)=8n-2' in m
          assert 'does not imply that root compression retains more raw information' in m
          assert 'fig5_required_snr_vs_bandwidth_rev9.pdf' in m
          assert 'uni-traveling-carrier photodiode' in m.lower() and 'not a UTC-PD device model' in m
          assert 'ishibashi1997utc' in b and '10.1364/UEO.1997.UC3' in b
          assert '0.1,0.25,0.5,1,2,4,10' in s
          assert '$+1.494^*$' in s and '1.4936\\times10^{-3}' in s
          assert '-7.68\\times10^{7}' in s and '+3.36\\times10^{-1}' in s
          assert r'\nu_{\rm root}=10' in s and r'\nu_{\rm full}=46' in s
          assert 'not an information-ordering statement' in s
          assert 'single-mobile-carrier' in m and 'unipolar' in m
          for q in ('first-ever','for the first time','universal false diffusion','fundamental new mechanism'):
              assert q.lower() not in t.lower()
          for q in ('hostile review','validation helper','failed in the reporting layer'):
              assert q not in t.lower()
          PY
      - name: Regenerate canonical figures and Rev9 Figure 5
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python paper02_independent_velocity_profiles.py
          python paper02_kernel_tail_ablation.py
          python paper02_bias_bound_linearization.py
          python paper02_end_to_end_rejection_snr.py
          python paper02_build_figure_bundle.py
          python paper02_build_fig5_rev9.py
          test -s paper02_figures/fig1_generation_kernels.pdf
          test -s paper02_figures/fig5_required_snr_vs_bandwidth_rev9.pdf
      - name: Install TeX tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-extra texlive-publishers texlive-science poppler-utils
      - name: Compile Rev9 main and supplement
        working-directory: experiments/01-vanishing-absorber
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error PAPER02_MANUSCRIPT_REV9_ANON_2026-08-16.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error PAPER02_SUPPLEMENT_REV9_ANON_2026-08-16.tex
          for log in PAPER02_MANUSCRIPT_REV9_ANON_2026-08-16.log PAPER02_SUPPLEMENT_REV9_ANON_2026-08-16.log; do
            if grep -E "LaTeX Warning: (Citation|Reference).*undefined|There were undefined references|There were undefined citations" "$log"; then exit 1; fi
          done
          pdftotext PAPER02_MANUSCRIPT_REV9_ANON_2026-08-16.pdf - | grep -q 'Uni-Traveling-Carrier'
          pdfinfo PAPER02_MANUSCRIPT_REV9_ANON_2026-08-16.pdf | grep Pages
          pdfinfo PAPER02_SUPPLEMENT_REV9_ANON_2026-08-16.pdf | grep Pages
          sha256sum PAPER02_MANUSCRIPT_REV9_ANON_2026-08-16.pdf PAPER02_SUPPLEMENT_REV9_ANON_2026-08-16.pdf
      - name: Persist deterministic Rev9 sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch='agent/publication-mining-roadmap'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            (cd experiments/01-vanishing-absorber && python tools/build_paper02_rev9.py)
            git add experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_REV9_ANON_2026-08-16.tex experiments/01-vanishing-absorber/PAPER02_SUPPLEMENT_REV9_ANON_2026-08-16.tex experiments/01-vanishing-absorber/PAPER02_REFERENCES_REV9.bib
            if git diff --cached --quiet; then break; fi
            git commit -m 'Build Paper 02 Rev9 targeted referee-response manuscript'
            if git push origin "HEAD:$branch"; then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
          done
      - name: Upload Rev9 package
        uses: actions/upload-artifact@v4
        with:
          name: paper02-manuscript-rev9-package
          path: |
            experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_REV9_ANON_2026-08-16.pdf
            experiments/01-vanishing-absorber/PAPER02_SUPPLEMENT_REV9_ANON_2026-08-16.pdf
            experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_REV9_ANON_2026-08-16.tex
            experiments/01-vanishing-absorber/PAPER02_SUPPLEMENT_REV9_ANON_2026-08-16.tex
            experiments/01-vanishing-absorber/PAPER02_REFERENCES_REV9.bib
            experiments/01-vanishing-absorber/numerics/paper02_figures/fig5_required_snr_vs_bandwidth_rev9.pdf
            experiments/01-vanishing-absorber/numerics/paper02_figures/fig5_required_snr_vs_bandwidth_rev9.png
            experiments/01-vanishing-absorber/numerics/paper02_two_carrier_exact_continuum.py
            experiments/01-vanishing-absorber/numerics/paper02_two_carrier_known_countercarrier.py
            experiments/01-vanishing-absorber/numerics/paper02_full_channel_rejection.py
            experiments/01-vanishing-absorber/numerics/results/paper02_two_carrier_exact_continuum_summary.json
            experiments/01-vanishing-absorber/numerics/results/paper02_two_carrier_known_countercarrier_summary.json
            experiments/01-vanishing-absorber/numerics/results/paper02_full_channel_rejection_summary.json
          if-no-files-found: error
