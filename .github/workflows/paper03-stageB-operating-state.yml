name: Paper 03 Stage B operating-state validation

on:
  pull_request:
    paths:
      - 'experiments/01-vanishing-absorber/PAPER03_STAGEB_MODEL_SPEC_2026-08-17.md'
      - 'experiments/01-vanishing-absorber/PAPER03_STAGEB_OPERATING_STATE_VALIDATION_LOCK_2026-08-17.md'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageB_operating_state.py'
      - '.github/workflows/paper03-stageB-operating-state.yml'
  workflow_dispatch:

jobs:
  operating-state-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Compile solver
        run: python -m py_compile experiments/01-vanishing-absorber/numerics/paper03_stageB_operating_state.py
      - name: Run locked generic coupled validation
        run: |
          cd experiments/01-vanishing-absorber/numerics
          python paper03_stageB_operating_state.py --output paper03_stageB_operating_state.json
      - name: Enforce claim boundary and gates
        run: |
          python - <<'PY'
          import json
          p='experiments/01-vanishing-absorber/numerics/paper03_stageB_operating_state.json'
          d=json.load(open(p))
          assert d['stageB_numerically_established'] is False
          assert d['science_interpretation_ready'] is False
          assert d['status']=='GENERIC SELF-CONSISTENT OPERATING-STATE VALIDATION / NON-CLAIM'
          for key in ('equilibrium_validation','finite_bias_validation'):
              f=d[key]['final_iteration']
              assert f['poisson_relative_residual']<1e-8
              assert f['continuity_relative_residual']<1e-8
          c=d['finite_bias_validation']['current']
          assert c['horizontal_cut_max_fractional_deviation']<1e-5
          assert c['terminal_balance_fraction']<1e-5
          assert d['finite_bias_validation']['min_n_over_Nd']<0.80
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper03-stageB-operating-state-validation
          path: experiments/01-vanishing-absorber/numerics/paper03_stageB_operating_state.json
