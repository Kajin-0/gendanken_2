name: Paper 03 manuscript Rev2 gate

on:
  push:
    branches: [agent/paper03-manuscript-rev1]
    paths:
      - 'experiments/01-vanishing-absorber/PAPER03_MANUSCRIPT_REV2_ANON_2026-08-19.tex'
      - '.github/workflows/paper03-manuscript-rev1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/01-vanishing-absorber/PAPER03_MANUSCRIPT_REV2_ANON_2026-08-19.tex'
      - '.github/workflows/paper03-manuscript-rev1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manuscript-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enforce frozen claim and privacy boundary
        working-directory: experiments/01-vanishing-absorber
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('PAPER03_MANUSCRIPT_REV2_ANON_2026-08-19.tex')
          t=p.read_text(); low=t.lower()
          assert t.count(r'\author{Anonymous}') == 1
          assert 'pdfauthor={Anonymous}' in t
          assert r'\usepackage{lmodern}' in t
          for s in ('9.16 dB','43.100 dB','39.200 dB','B2-A','96\\times75','112\\times87'):
              assert s in t
          assert 'generic and single-electron' in t
          assert 'not presented as a material-specific HgCdTe calculation' in t
          assert 'Stage-B precision thresholds are analytic' in t
          assert 'No first-ever or superlative priority claim is made.' in t
          assert 'diagnostic only' in t
          assert 'not retroactively relabeled as passes' in t
          assert 'predeclared 60-row' in t
          assert '60-point' not in t
          assert 'not identically calibrated statistical tests' in t
          assert 'pre-existing frozen $3\\sigma$ current-step threshold' in t
          for q in ('for the first time','world first','universal guarantee'):
              assert q not in low
          PY
      - name: Install TeX tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk lmodern texlive-latex-extra texlive-science poppler-utils
      - name: Compile anonymous Rev2
        working-directory: experiments/01-vanishing-absorber
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error PAPER03_MANUSCRIPT_REV2_ANON_2026-08-19.tex
          log=PAPER03_MANUSCRIPT_REV2_ANON_2026-08-19.log
          if grep -E "LaTeX Warning: (Citation|Reference).*undefined|There were undefined references|There were undefined citations" "$log"; then exit 1; fi
          pdftotext PAPER03_MANUSCRIPT_REV2_ANON_2026-08-19.pdf paper03_rev2.txt
          grep -q 'Precision-ordered falsification' paper03_rev2.txt
          grep -q 'Anonymous' paper03_rev2.txt
          grep -q '9.16 dB' paper03_rev2.txt
          grep -q '39.200 dB' paper03_rev2.txt
          pdfinfo PAPER03_MANUSCRIPT_REV2_ANON_2026-08-19.pdf | tee paper03_rev2_pdfinfo.txt
          pdfinfo PAPER03_MANUSCRIPT_REV2_ANON_2026-08-19.pdf | grep -q 'Author:.*Anonymous'
          sha256sum PAPER03_MANUSCRIPT_REV2_ANON_2026-08-19.pdf | tee paper03_rev2_sha256.txt
      - name: Upload Rev2 manuscript package
        uses: actions/upload-artifact@v4
        with:
          name: paper03-manuscript-rev2
          path: |
            experiments/01-vanishing-absorber/PAPER03_MANUSCRIPT_REV2_ANON_2026-08-19.tex
            experiments/01-vanishing-absorber/PAPER03_MANUSCRIPT_REV2_ANON_2026-08-19.pdf
            experiments/01-vanishing-absorber/paper03_rev2_pdfinfo.txt
            experiments/01-vanishing-absorber/paper03_rev2_sha256.txt
          if-no-files-found: error
