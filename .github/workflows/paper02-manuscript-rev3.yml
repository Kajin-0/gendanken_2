name: Paper 02 manuscript Rev3 figure-bearing build

on:
  push:
    branches:
      - agent/publication-mining-roadmap
    paths:
      - 'experiments/01-vanishing-absorber/tools/build_paper02_rev3.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_build_figure_bundle.py'
      - '.github/workflows/paper02-manuscript-rev3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical and plotting dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy matplotlib
      - name: Regenerate canonical figure data
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python paper02_independent_velocity_profiles.py
          python paper02_kernel_tail_ablation.py
          python paper02_bias_bound_linearization.py
          python paper02_end_to_end_rejection_snr.py
          python paper02_build_figure_bundle.py
      - name: Build Rev3 from frozen Rev2
        working-directory: experiments/01-vanishing-absorber
        run: python tools/build_paper02_rev3.py
      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-extra texlive-publishers texlive-science poppler-utils
      - name: Compile Rev3 with regenerated figures
        working-directory: experiments/01-vanishing-absorber
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error PAPER02_MANUSCRIPT_REV3_ANON_2026-08-15.tex
      - name: Check unresolved references
        working-directory: experiments/01-vanishing-absorber
        run: |
          if grep -E "LaTeX Warning: (Citation|Reference).*undefined|There were undefined references" PAPER02_MANUSCRIPT_REV3_ANON_2026-08-15.log; then
            echo 'Unresolved citation/reference detected.'
            exit 1
          fi
      - name: Report compiled manuscript
        working-directory: experiments/01-vanishing-absorber
        run: |
          pdfinfo PAPER02_MANUSCRIPT_REV3_ANON_2026-08-15.pdf | grep -E 'Pages|Title|Author' || true
          sha256sum PAPER02_MANUSCRIPT_REV3_ANON_2026-08-15.pdf
      - name: Persist Rev3 source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_REV3_ANON_2026-08-15.tex
          if git diff --cached --quiet; then
            echo 'Rev3 source already current.'
          else
            git commit -m 'Integrate canonical figures into Paper 02 Rev3'
            git push
          fi
      - name: Upload manuscript and figure bundle
        uses: actions/upload-artifact@v4
        with:
          name: paper02-manuscript-rev3-figures
          path: |
            experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_REV3_ANON_2026-08-15.pdf
            experiments/01-vanishing-absorber/numerics/paper02_figures/*.pdf
            experiments/01-vanishing-absorber/numerics/paper02_figures/*.png
          if-no-files-found: error
