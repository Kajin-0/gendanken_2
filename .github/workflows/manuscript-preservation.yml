name: Manuscript preservation

on:
  pull_request:
    paths:
      - 'experiments/01-vanishing-absorber/MANUSCRIPT*.tex'
      - 'experiments/01-vanishing-absorber/MANUSCRIPT_BASELINE.json'
      - 'experiments/01-vanishing-absorber/MANUSCRIPT_BASELINE.md'
      - 'experiments/01-vanishing-absorber/MANUSCRIPT_CURRENT.md'
      - 'experiments/01-vanishing-absorber/MANUSCRIPT_PRESERVATION_PROTOCOL.md'
      - 'experiments/01-vanishing-absorber/MANUSCRIPT_DESTRUCTIVE_EDIT_JUSTIFICATION.md'
      - 'experiments/01-vanishing-absorber/manuscript_history/**'
      - 'tools/check_manuscript_preservation.py'
      - 'tools/extract_manuscript_baseline.py'
      - 'tools/test_manuscript_preservation_guard.py'
      - '.github/workflows/manuscript-preservation.yml'
  push:
    branches:
      - main
    paths:
      - 'experiments/01-vanishing-absorber/MANUSCRIPT*.tex'
      - 'experiments/01-vanishing-absorber/MANUSCRIPT_BASELINE.json'
      - 'experiments/01-vanishing-absorber/MANUSCRIPT_BASELINE.md'
      - 'experiments/01-vanishing-absorber/MANUSCRIPT_CURRENT.md'
      - 'experiments/01-vanishing-absorber/MANUSCRIPT_PRESERVATION_PROTOCOL.md'
      - 'experiments/01-vanishing-absorber/MANUSCRIPT_DESTRUCTIVE_EDIT_JUSTIFICATION.md'
      - 'experiments/01-vanishing-absorber/manuscript_history/**'
      - 'tools/check_manuscript_preservation.py'
      - 'tools/extract_manuscript_baseline.py'
      - 'tools/test_manuscript_preservation_guard.py'
      - '.github/workflows/manuscript-preservation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preservation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify canonical snapshot and guard behavior
        run: python tools/test_manuscript_preservation_guard.py

      - name: Verify changed manuscript source is preservation-safe
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          manifest='experiments/01-vanishing-absorber/MANUSCRIPT_BASELINE.json'
          justification='experiments/01-vanishing-absorber/MANUSCRIPT_DESTRUCTIVE_EDIT_JUSTIFICATION.md'

          if [[ ! -f "$manifest" ]]; then
            echo 'Missing manuscript baseline manifest.' >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            git fetch --no-tags origin "$BASE_REF"
            base="origin/$BASE_REF"
          elif [[ "$EVENT_NAME" == 'push' ]] && git rev-parse HEAD^ >/dev/null 2>&1; then
            base='HEAD^'
          else
            base=''
          fi

          if [[ -n "$base" ]]; then
            mapfile -t changed < <(
              git diff --name-only "$base"...HEAD |
              grep -E '^experiments/01-vanishing-absorber/MANUSCRIPT[^/]*\.tex$' || true
            )
          else
            changed=()
          fi

          # MANUSCRIPT_CURRENT.tex is generated during the snapshot self-test. It is
          # not considered a committed change unless git reports it above.
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo 'No committed main manuscript TeX file changed; canonical snapshot/self-test already passed.'
            exit 0
          fi

          for candidate in "${changed[@]}"; do
            echo "Checking $candidate"
            args=(
              --candidate "$candidate"
              --manifest "$manifest"
              --justification "$justification"
            )

            if git cat-file -e "$base:$candidate" 2>/dev/null; then
              tmp="$(mktemp --suffix=.tex)"
              git show "$base:$candidate" > "$tmp"
              args+=(--base "$tmp")
            fi

            python tools/check_manuscript_preservation.py "${args[@]}"
          done
