name: Paper 03 Stage A regime selected-point refinement

on:
  pull_request:
    paths:
      - 'experiments/01-vanishing-absorber/PAPER03_STAGEA_REGIME_SELECTION_MANIFEST_2026-08-17.json'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_regime_refine.py'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_regime_screen.py'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_resolvent.py'
      - '.github/workflows/paper03-stageA-regime-refine.yml'
  push:
    branches:
      - agent/paper03-combined-physics
    paths:
      - 'experiments/01-vanishing-absorber/PAPER03_STAGEA_REGIME_SELECTION_MANIFEST_2026-08-17.json'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_regime_refine.py'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_regime_screen.py'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_resolvent.py'
      - '.github/workflows/paper03-stageA-regime-refine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selected-point-refinement:
    if: ${{ hashFiles('experiments/01-vanishing-absorber/PAPER03_STAGEA_REGIME_SELECTION_MANIFEST_2026-08-17.json') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Refine predeclared selected points
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python -m py_compile paper03_stageA_regime_refine.py
          python paper03_stageA_regime_refine.py \
            --manifest ../PAPER03_STAGEA_REGIME_SELECTION_MANIFEST_2026-08-17.json \
            --output paper03_stageA_regime_refinement.json

      - name: Verify frozen refinement structure
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('paper03_stageA_regime_refinement.json').read_text())
          assert r['science_interpretation_ready'] is False
          assert r['phase_refinement_fraction_gate'] == 0.02
          assert r['grids'] == [[161,121],[201,151]]
          assert r['lateral_quadrature'] == 17
          assert 1 <= r['counts']['selected_unique_points'] <= 8
          for p in r['selected_point_results']:
              for d in p['numerical']['case_solver_diagnostics'].values():
                  assert d['max_linear_relative_residual'] < 1e-8
                  assert d['committor_relative_residual'] < 1e-8
              for d in p['numerical']['reference_solver_diagnostics'].values():
                  assert d['max_linear_relative_residual'] < 1e-8
                  assert d['committor_relative_residual'] < 1e-8
          print(json.dumps(r['counts'],indent=2))
          print(json.dumps(r['predeclared_new_bootstrap_points'],indent=2))
          PY

      - name: Upload selected-point refinement
        uses: actions/upload-artifact@v4
        with:
          name: paper03-stageA-regime-refinement
          path: experiments/01-vanishing-absorber/numerics/paper03_stageA_regime_refinement.json
          if-no-files-found: error
