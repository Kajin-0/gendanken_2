name: Paper 03 Stage A resolvent post-gate refinement

on:
  pull_request:
    paths:
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_resolvent.py'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_resolvent_extended_check.py'
      - '.github/workflows/paper03-stageA-resolvent-extended.yml'
  push:
    branches:
      - agent/paper03-combined-physics
    paths:
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_resolvent.py'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_resolvent_extended_check.py'
      - '.github/workflows/paper03-stageA-resolvent-extended.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgate-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Run post-gate adversarial refinement
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python -m py_compile paper03_stageA_resolvent_extended_check.py
          python paper03_stageA_resolvent_extended_check.py \
            --output paper03_stageA_resolvent_extended_check.json

      - name: Verify invariants and non-claim status
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('paper03_stageA_resolvent_extended_check.json').read_text())
          assert r['predeclared_gate_changed'] is False
          assert r['science_interpretation_ready'] is False
          assert len(r['cases']) == 3
          for case in r['cases']:
              d = case['solver_diagnostics']
              assert d['max_linear_relative_residual'] < 1e-8
              assert d['committor_relative_residual'] < 1e-8
              assert d['dc_committor_ramo_max_abs_error'] < 1e-8
          print(json.dumps(r['grid_pairs'], indent=2))
          PY

      - name: Upload post-gate record
        uses: actions/upload-artifact@v4
        with:
          name: paper03-stageA-resolvent-postgate
          path: experiments/01-vanishing-absorber/numerics/paper03_stageA_resolvent_extended_check.json
          if-no-files-found: error
