name: Paper 03 Stage A selected-point bootstrap shards

on:
  pull_request:
    paths:
      - 'experiments/01-vanishing-absorber/PAPER03_STAGEA_SELECTED_BOOTSTRAP_EXECUTION_LOCK_2026-08-17.md'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_selected_bootstrap_shard.py'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_regime_refine.py'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_statistical_bootstrap.py'
      - '.github/workflows/paper03-stageA-selected-bootstrap-shards.yml'
  push:
    branches:
      - agent/paper03-combined-physics
    paths:
      - 'experiments/01-vanishing-absorber/PAPER03_STAGEA_SELECTED_BOOTSTRAP_EXECUTION_LOCK_2026-08-17.md'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_selected_bootstrap_shard.py'
      - '.github/workflows/paper03-stageA-selected-bootstrap-shards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selected-bootstrap:
    strategy:
      fail-fast: false
      matrix:
        include:
          - manifest_id: R2_A04
            rf_index: 1
            rf_label: 100MHz
          - manifest_id: R2_A04
            rf_index: 2
            rf_label: 500MHz
          - manifest_id: R2_A04
            rf_index: 3
            rf_label: 1GHz
          - manifest_id: R1_B04
            rf_index: 1
            rf_label: 100MHz
          - manifest_id: R1_B04
            rf_index: 2
            rf_label: 500MHz
          - manifest_id: R1_B04
            rf_index: 3
            rf_label: 1GHz
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run locked selected-point bootstrap shard
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python -m py_compile paper03_stageA_selected_bootstrap_shard.py paper03_stageA_statistical_bootstrap.py paper03_stageA_regime_refine.py
          python paper03_stageA_selected_bootstrap_shard.py \
            --manifest-id ${{ matrix.manifest_id }} \
            --rf-index ${{ matrix.rf_index }} \
            --output paper03_stageA_selected_bootstrap_${{ matrix.manifest_id }}_${{ matrix.rf_label }}.json
      - name: Verify locked statistical structure
        working-directory: experiments/01-vanishing-absorber/numerics
        env:
          MANIFEST_ID: ${{ matrix.manifest_id }}
          RF_INDEX: ${{ matrix.rf_index }}
          RF_LABEL: ${{ matrix.rf_label }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(f"paper03_stageA_selected_bootstrap_{os.environ['MANIFEST_ID']}_{os.environ['RF_LABEL']}.json")
          r = json.loads(p.read_text())
          assert r['manifest_id'] == os.environ['MANIFEST_ID']
          assert r['science_interpretation_ready'] is False
          assert r['bootstrap']['alpha'] == 0.002699796063260207
          assert r['bootstrap']['target_power'] == 0.90
          assert r['bootstrap']['n_null_per_candidate'] == 4000
          assert r['bootstrap']['n_alternative_per_candidate'] == 2000
          assert r['bootstrap']['snr_offsets_from_analytic_db'] == [-4.0,-2.0,0.0,2.0,4.0]
          g = r['rf_gate']
          assert len(g['bootstrap_rows']) == 5
          for check in g['fast_refit_spot_checks_at_analytic_snr'].values():
              assert check['max_fast_over_full_residual_norm_ratio'] <= 1.001
          print(r['manifest_id'], g['frequency_hz'], g['predeclared_early_warning_condition_supported'], g['conservative_tested_warning_margin_db'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper03-stageA-selected-bootstrap-${{ matrix.manifest_id }}-${{ matrix.rf_label }}
          path: experiments/01-vanishing-absorber/numerics/paper03_stageA_selected_bootstrap_${{ matrix.manifest_id }}_${{ matrix.rf_label }}.json
          if-no-files-found: error
