name: Paper 03 targeted unresolved gates

on:
  pull_request:
    branches: [agent/paper03-combined-physics]
    paths:
      - '.github/workflows/paper03-targeted-ci.yml'

permissions:
  contents: read

jobs:
  coplanar-500-bootstrap-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run unchanged statistical experiment with optimizer-only repair
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python -m py_compile paper03_second_geometry_bootstrap_500_repair.py
          python paper03_second_geometry_bootstrap_500_repair.py
      - name: Verify repair integrity and frozen statistical contract
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python - <<'PY'
          import json
          d=json.load(open('paper03_second_geometry_bootstrap_500_repair.json'))
          assert d['bootstrap']=={'alpha':0.002699796063260207,'target_power':0.9,'n_null':4000,'n_alt':2000,'snr_offsets_db':[-4.0,-2.0,0.0,2.0,4.0]}
          assert d['rf_gate']['frequency_hz']==500000000.0
          assert d['science_interpretation_ready'] is False
          assert d['rf_gate']['predeclared_early_warning_condition_supported'] is True
          for c in d['rf_gate']['fast_refit_spot_checks_at_analytic_snr'].values():
              assert c['max_fast_over_full_residual_norm_ratio']<=1.001
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper03-targeted-coplanar-500-repair
          path: experiments/01-vanishing-absorber/numerics/paper03_second_geometry_bootstrap_500_repair.json
          if-no-files-found: error

  stageB-mesh-weighting-reciprocity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run locked refined generic Stage-B gate
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python -m py_compile paper03_stageB_mesh_weighting_reciprocity.py
          python paper03_stageB_mesh_weighting_reciprocity.py --output paper03_stageB_mesh_weighting_reciprocity.json
      - name: Enforce unchanged refined Stage-B thresholds
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python - <<'PY'
          import json
          d=json.load(open('paper03_stageB_mesh_weighting_reciprocity.json'))
          assert d['stageB_numerically_established'] is False
          assert d['science_interpretation_ready'] is False
          assert d['generic_mesh_weighting_reciprocity_layer_passed'] is True
          c=d['adjacent_mesh_convergence'][-1]
          assert c['acceptance_pair'] is True
          assert c['pass_all_unchanged_thresholds'] is True
          assert c['terminal_current_relative_change']<=0.03
          assert c['centerline_potential_rms_scaled']<=0.02
          assert c['centerline_density_rms_over_Nd']<=0.03
          assert c['min_n_over_Nd_relative_change']<=0.05
          assert c['centerline_weighting_rms_change']<=0.02
          s=d['signal_validation']
          assert s['committor_relative_residual']<1e-8
          assert s['ramo_dc_relative_residual']<1e-8
          assert s['dc_committor_ramo_max_abs_error']<1e-8
          assert s['backward_relative_residual']<1e-8
          assert s['forward_relative_residual']<1e-8
          assert s['reciprocity_relative_mismatch']<1e-9
          assert s['operator_diagnostics']['forward_backward_operator_relative_mismatch']<1e-12
          assert abs(s['low_injection_peak_delta_n_over_Nd']-1e-4)<1e-12
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper03-targeted-stageB-mesh-weighting-reciprocity
          path: experiments/01-vanishing-absorber/numerics/paper03_stageB_mesh_weighting_reciprocity.json
          if-no-files-found: error
