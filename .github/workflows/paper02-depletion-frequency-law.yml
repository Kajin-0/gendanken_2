name: Paper 02 depletion frequency law

on:
  push:
    branches:
      - agent/publication-mining-roadmap
    paths:
      - 'experiments/01-vanishing-absorber/numerics/paper02_planar_depletion_frequency_law.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_geometry_factorial_decomposition.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_geometry_parameter_sweep.py'
      - 'experiments/01-vanishing-absorber/numerics/realistic_geometry_closure_stress.py'
      - 'experiments/01-vanishing-absorber/numerics/hgcdte_ramo_four_color_gradient_prediction.py'
      - '.github/workflows/paper02-depletion-frequency-law.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dense-frequency:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run dense frequency-law test
        working-directory: experiments/01-vanishing-absorber/numerics
        run: python paper02_planar_depletion_frequency_law.py
      - name: Print summary
        working-directory: experiments/01-vanishing-absorber/numerics
        run: cat paper02_planar_depletion_frequency_law_summary.json
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: paper02-depletion-frequency-law
          path: |
            experiments/01-vanishing-absorber/numerics/paper02_planar_depletion_frequency_law.csv
            experiments/01-vanishing-absorber/numerics/paper02_planar_depletion_frequency_law_summary.json
          if-no-files-found: error
