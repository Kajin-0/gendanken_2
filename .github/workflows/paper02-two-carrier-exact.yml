name: Paper 02 exact two-carrier closure gate

on:
  push:
    branches: [agent/publication-mining-roadmap]
    paths:
      - 'experiments/01-vanishing-absorber/PAPER02_TWO_CARRIER_GATE_2026-08-16.md'
      - 'experiments/01-vanishing-absorber/numerics/paper02_two_carrier_exact_continuum.py'
      - '.github/workflows/paper02-two-carrier-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-carrier-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/publication-mining-roadmap
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy matplotlib
      - name: Compile and execute exact two-carrier stress
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python -m py_compile paper02_two_carrier_exact_continuum.py
          python paper02_two_carrier_exact_continuum.py
      - name: Enforce predeclared control gate
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python - <<'PY'
          import json, math
          x=json.load(open('results/paper02_two_carrier_exact_continuum_summary.json'))
          assert x['dc_pair_identity_max_abs_error'] <= 1e-12, x['dc_pair_identity_max_abs_error']
          assert x['uniform_core_gate_pass'], x['core_summary']
          assert x['core_summary']['max_uniform_abs_D_m2_per_s'] <= 1e-7, x['core_summary']
          assert x['core_summary']['max_uniform_centered_fit_rel'] <= 1e-8, x['core_summary']
          print('classification:',x['classification'])
          print('core:',json.dumps(x['core_summary'],indent=2,sort_keys=True))
          PY
      - name: Upload two-carrier result
        uses: actions/upload-artifact@v4
        with:
          name: paper02-two-carrier-exact
          path: |
            experiments/01-vanishing-absorber/numerics/results/paper02_two_carrier_exact_continuum_summary.json
            experiments/01-vanishing-absorber/numerics/results/paper02_two_carrier_exact_continuum_rows.csv
          if-no-files-found: error
