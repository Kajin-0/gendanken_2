name: Paper 03 Stage A finite recombination gate

on:
  pull_request:
    paths:
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_recombination_gate.py'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_kernel_blind_gate.py'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_resolvent.py'
      - '.github/workflows/paper03-stageA-recombination.yml'
  push:
    branches:
      - agent/paper03-combined-physics
    paths:
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_recombination_gate.py'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_kernel_blind_gate.py'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_resolvent.py'
      - '.github/workflows/paper03-stageA-recombination.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-recombination:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Run finite-recombination gate
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python -m py_compile paper03_stageA_recombination_gate.py
          python paper03_stageA_recombination_gate.py \
            --output paper03_stageA_recombination_gate.json

      - name: Verify numerical gates and non-claim boundary
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('paper03_stageA_recombination_gate.json').read_text())
          assert r['science_interpretation_ready'] is False
          assert r['root_interpretation_allowed'] is False
          assert r['forward']['self_consistent_semiconductor'] is False
          assert r['numerical_checks']['grid_161_to_201']['passed'] is True
          assert r['numerical_checks']['source_quadrature_13_to_17']['passed'] is True
          assert r['numerical_checks']['finite_201']['solver_diagnostics']['max_linear_relative_residual'] < 1e-8
          print(json.dumps(r['numerical_checks']['grid_161_to_201'], indent=2))
          print(json.dumps(r['numerical_checks']['source_quadrature_13_to_17'], indent=2))
          print(json.dumps(r['same_physics_planar_reference'], indent=2))
          PY

      - name: Upload finite-recombination record
        uses: actions/upload-artifact@v4
        with:
          name: paper03-stageA-finite-recombination
          path: experiments/01-vanishing-absorber/numerics/paper03_stageA_recombination_gate.json
          if-no-files-found: error
