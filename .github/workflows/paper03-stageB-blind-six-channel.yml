name: Paper 03 final Stage B blind six-channel gate

on:
  pull_request:
    branches: [agent/paper03-combined-physics]
    paths:
      - 'experiments/01-vanishing-absorber/PAPER03_STAGEB_BLIND_SIX_CHANNEL_LOCK_2026-08-18.md'
      - 'experiments/01-vanishing-absorber/PAPER03_STAGEB_BLIND_CLASSIFICATION_CLARIFICATION_2026-08-18.md'
      - 'experiments/01-vanishing-absorber/PAPER03_STAGEB_BLIND_V2_REFINEMENT_LOCK_2026-08-18.md'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageB_blind_six_channel.py'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageB_blind_six_channel_conservative.py'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageB_blind_six_channel_v2.py'
      - '.github/workflows/paper03-stageB-blind-six-channel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stageB-blind-six-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Compile final Stage B blind v2 gate
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python -m py_compile paper03_stageB_blind_six_channel.py
          python -m py_compile paper03_stageB_blind_six_channel_conservative.py
          python -m py_compile paper03_stageB_blind_six_channel_v2.py
      - name: Execute predeclared Stage B blind v2 production gate
        working-directory: experiments/01-vanishing-absorber/numerics
        run: python paper03_stageB_blind_six_channel_v2.py --output paper03_stageB_blind_six_channel.json
      - name: Enforce locked numerical and blind-contract boundary
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python - <<'PY'
          import json
          d=json.load(open('paper03_stageB_blind_six_channel.json'))
          assert d['generic_stageB_minimum_milestone_passed'] is True
          assert d['science_interpretation_ready'] is False
          assert d['paper03_standalone_go_recorded_here'] is False
          u=d['upstream_validation']['acceptance_pair_result']
          assert u['acceptance_pair'] is True and u['pass_all_unchanged_thresholds'] is True
          assert u['terminal_current_relative_change'] <= 0.03
          assert u['centerline_potential_rms_scaled'] <= 0.02
          assert u['centerline_density_rms_over_Nd'] <= 0.03
          assert u['min_n_over_Nd_relative_change'] <= 0.05
          assert u['centerline_weighting_rms_change'] <= 0.02
          s=d['upstream_validation']['signal_validation']
          assert s['dc_committor_ramo_max_abs_error'] < 1e-8
          assert s['reciprocity_relative_mismatch'] < 1e-9
          assert s['operator_diagnostics']['forward_backward_operator_relative_mismatch'] < 1e-12
          for key in ('blind_observable_convergence_finite','reference_observable_convergence_planar'):
              assert d[key]['schema']=='paper03-stageB-blind-observable-convergence-v2'
              assert d[key]['production_mesh_pair']==[[91,71],[101,79]]
              assert d[key]['pass'] is True
              for r in d[key]['rows']:
                  assert r['complex_affine_shape_residual'] <= 0.02
                  assert r['raw_phase_acceptance_status'].startswith('diagnostic only')
          bi=d['blind_fine']['input_contract']
          assert set(bi)=={'currents','frequencies_hz','z_cell_centers_um','normalized_calibrated_depth_weights','alpha','target_power','frozen_false_claim_snr_db'}
          assert bi['frequencies_hz']==[0.0,100000000.0,500000000.0,1000000000.0]
          assert abs(bi['alpha']-0.002699796063260207)<1e-18
          assert bi['target_power']==0.9
          assert len(d['blind_fine']['one_mode_fits'])==4
          assert len(d['blind_fine']['two_mode_fits_nonzero_rf'])==3
          assert len(d['blind_fine']['analytic_warning_before_claim'])==3
          assert d['predeclared_outcome'].startswith(('B2-A:','B2-B:','B2-C:','B2-D:'))
          if d['finite_vs_planar_comparison_not_used_by_blind_fit']['max_historical_mimic_fraction']>=0.5:
              early=all(r['early_warning_analytic'] for r in d['blind_fine']['analytic_warning_before_claim'])
              if not early:
                  assert d['predeclared_outcome'].startswith('B2-B:')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper03-stageB-blind-six-channel-v2
          path: experiments/01-vanishing-absorber/numerics/paper03_stageB_blind_six_channel.json
          if-no-files-found: error
