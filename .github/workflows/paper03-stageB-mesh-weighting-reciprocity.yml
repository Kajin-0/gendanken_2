name: Paper 03 Stage B mesh weighting reciprocity

on:
  pull_request:
    paths:
      - 'experiments/01-vanishing-absorber/PAPER03_STAGEB_MESH_WEIGHTING_RECIPROCITY_LOCK_2026-08-17.md'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageB_operating_state.py'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageB_mesh_weighting_reciprocity.py'
      - '.github/workflows/paper03-stageB-mesh-weighting-reciprocity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mesh-weighting-reciprocity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Compile Stage B validation
        working-directory: experiments/01-vanishing-absorber/numerics
        run: python -m py_compile paper03_stageB_mesh_weighting_reciprocity.py
      - name: Run frozen Stage B mesh weighting reciprocity gate
        working-directory: experiments/01-vanishing-absorber/numerics
        run: python paper03_stageB_mesh_weighting_reciprocity.py --output paper03_stageB_mesh_weighting_reciprocity.json
      - name: Enforce claim boundary
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python - <<'PY'
          import json
          d=json.load(open('paper03_stageB_mesh_weighting_reciprocity.json'))
          assert d['stageB_numerically_established'] is False
          assert d['science_interpretation_ready'] is False
          c=d['middle_to_fine']
          assert c['terminal_current_relative_change']<=0.03
          assert c['centerline_potential_rms_scaled']<=0.02
          assert c['centerline_density_rms_over_Nd']<=0.03
          assert c['min_n_over_Nd_relative_change']<=0.05
          assert c['centerline_weighting_rms_change']<=0.02
          s=d['signal_validation']
          assert s['dc_committor_ramo_max_abs_error']<1e-8
          assert s['reciprocity_relative_mismatch']<1e-9
          assert abs(s['low_injection_peak_delta_n_over_Nd']-1e-4)<1e-12
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper03-stageB-mesh-weighting-reciprocity
          path: experiments/01-vanishing-absorber/numerics/paper03_stageB_mesh_weighting_reciprocity.json
          if-no-files-found: error
