name: Paper 02 factorial decomposition

on:
  push:
    branches:
      - agent/publication-mining-roadmap
    paths:
      - 'experiments/01-vanishing-absorber/numerics/paper02_geometry_factorial_decomposition.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_geometry_parameter_sweep.py'
      - 'experiments/01-vanishing-absorber/numerics/realistic_geometry_closure_stress.py'
      - 'experiments/01-vanishing-absorber/numerics/hgcdte_ramo_four_color_gradient_prediction.py'
      - '.github/workflows/paper02-factorial.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  factorial:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run factorial decomposition
        working-directory: experiments/01-vanishing-absorber/numerics
        run: python paper02_geometry_factorial_decomposition.py
      - name: Print summary
        working-directory: experiments/01-vanishing-absorber/numerics
        run: cat paper02_factorial_summary.json
      - name: Upload factorial outputs
        uses: actions/upload-artifact@v4
        with:
          name: paper02-factorial
          path: |
            experiments/01-vanishing-absorber/numerics/paper02_factorial_metrics.csv
            experiments/01-vanishing-absorber/numerics/paper02_factorial_raw_complex.csv
            experiments/01-vanishing-absorber/numerics/paper02_factorial_tangent.csv
            experiments/01-vanishing-absorber/numerics/paper02_factorial_decomposition.csv
            experiments/01-vanishing-absorber/numerics/paper02_factorial_summary.json
          if-no-files-found: error
