name: Paper 02 kernel misspecification stress

on:
  push:
    branches:
      - agent/publication-mining-roadmap
    paths:
      - 'experiments/01-vanishing-absorber/numerics/paper02_kernel_misspecification_stress.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_exact_planar_continuum_crosscheck.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_same_frequency_hidden_risk.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_kernel_aware_depletion_frequency_law.py'
      - 'experiments/01-vanishing-absorber/numerics/realistic_geometry_closure_stress.py'
      - 'experiments/01-vanishing-absorber/numerics/hgcdte_ramo_four_color_gradient_prediction.py'
      - '.github/workflows/paper02-kernel-misspecification-stress.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Syntax check
        working-directory: experiments/01-vanishing-absorber/numerics
        run: python -m py_compile paper02_kernel_misspecification_stress.py
      - name: Run kernel misspecification stress
        working-directory: experiments/01-vanishing-absorber/numerics
        run: python paper02_kernel_misspecification_stress.py
      - name: Print compact summary
        working-directory: experiments/01-vanishing-absorber/numerics
        run: python -c "import json; p=json.load(open('paper02_kernel_misspecification_stress_summary.json')); print(json.dumps(p['summary'], indent=2, sort_keys=True))"
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: paper02-kernel-misspecification-stress
          path: |
            experiments/01-vanishing-absorber/numerics/paper02_kernel_misspecification_stress.csv
            experiments/01-vanishing-absorber/numerics/paper02_kernel_misspecification_stress_summary.json
          if-no-files-found: error
