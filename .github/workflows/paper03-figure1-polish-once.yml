name: Paper 03 Figure 1 polish (one shot)

on:
  push:
    branches: [agent/paper03-manuscript-rev1]
    paths:
      - '.github/workflows/paper03-figure1-polish-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/paper03-manuscript-rev1
          fetch-depth: 0
      - name: Replace Figure 1 with cleaner hierarchy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('experiments/01-vanishing-absorber/PAPER03_MANUSCRIPT_REV2_ANON_2026-08-19.tex')
          t = p.read_text()
          old = r'''\begin{figure}[H]
\centering
\begin{tikzpicture}[
box/.style={draw,rounded corners=1.5pt,align=center,text width=3.1cm,minimum height=0.95cm,font=\small},
arr/.style={-{Latex[length=2mm]},line width=.45pt}]
\node[box] (obs) at (0,0) {six calibrated spectral kernels\\$+\ J_m(\omega)$};
\node[box] (one) at (4.4,0) {one-mode null\\$J_m=A+B M_m(r)$};
\node[box] (two) at (8.8,0) {two-mode diagnostic\\$r_1,r_2$};
\node[box] (law) at (13.2,0) {physical root law\\$r_1+r_2\in\mathbb R$, RF-invariant};
\node[box] (warn) at (6.6,-2.0) {$S_{\rm warn}$\\model inadequacy detectable};
\node[box] (claim) at (11.0,-2.0) {$S_{\rm claim}$\\false microscopic claim};
\draw[arr] (obs)--(one); \draw[arr] (one)--(two); \draw[arr] (two)--(law);
\draw[arr] (one)--(warn); \draw[arr] (law)--(warn); \draw[arr] (warn)--node[above,font=\scriptsize]{desired ordering}(claim);
\end{tikzpicture}
\caption{Mechanism-blind warning-before-claim logic. The inverse is asked first whether a low-dimensional transport interpretation is adequate, not which hidden multidimensional mechanism generated the data.}
\label{fig:logic}
\end{figure}'''
          new = r'''\begin{figure}[H]
\centering
\begin{tikzpicture}[
box/.style={draw,line width=.55pt,align=center,inner xsep=8pt,inner ysep=7pt,font=\small},
arr/.style={-{Latex[length=2mm]},line width=.5pt},
note/.style={font=\scriptsize}]
\node[box,text width=3.2cm,minimum height=1.35cm] (data) {
  \textbf{Calibrated inputs}\\[1pt]
  depth kernels $g_m(z)$\\
  currents $J_m(\omega)$};
\node[box,text width=4.45cm,minimum height=1.35cm,right=1.0cm of data] (one) {
  \textbf{One-mode adequacy test}\\[1pt]
  $J_m=A+B M_m(r)$\\
  $\rho_1\;\Rightarrow\;S_{\rm warn}$};
\node[box,text width=4.45cm,minimum height=1.25cm,below=0.72cm of one] (two) {
  \textbf{Two-mode diagnostic}\\[1pt]
  fit $r_1,r_2$; test the homogeneous\\
  physical root law};
\node[box,text width=3.6cm,minimum height=1.55cm,right=1.0cm of one] (order) {
  \textbf{Precision ordering}\\[3pt]
  $\displaystyle S_{\rm warn}<S_{\rm claim}$\\[3pt]
  \footnotesize model failure detected first};
\draw[arr] (data) -- (one);
\draw[arr] (one) -- (order);
\draw[arr] (one) -- node[right,note]{if rejected} (two);
\end{tikzpicture}
\caption{Mechanism-blind warning-before-claim logic. The one-mode test sets $S_{\rm warn}$. If it is rejected, the two-mode/root-law check supplies a separate structural diagnostic. $S_{\rm claim}$ enters only in the final precision comparison.}
\label{fig:logic}
\end{figure}'''
          assert t.count(old) == 1, 'expected original Figure 1 block exactly once'
          t = t.replace(old, new)
          p.write_text(t)
          PY
      - name: Self-delete workflow and commit source repair
        run: |
          rm .github/workflows/paper03-figure1-polish-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/01-vanishing-absorber/PAPER03_MANUSCRIPT_REV2_ANON_2026-08-19.tex .github/workflows/paper03-figure1-polish-once.yml
          git commit -m 'Polish Paper 03 Figure 1'
          git push origin HEAD:agent/paper03-manuscript-rev1
      - name: Install TeX tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk lmodern texlive-latex-extra texlive-science poppler-utils
      - name: Compile revised manuscript
        working-directory: experiments/01-vanishing-absorber
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error PAPER03_MANUSCRIPT_REV2_ANON_2026-08-19.tex
          log=PAPER03_MANUSCRIPT_REV2_ANON_2026-08-19.log
          if grep -E "LaTeX Warning: (Citation|Reference).*undefined|There were undefined references|There were undefined citations" "$log"; then exit 1; fi
          pdfinfo PAPER03_MANUSCRIPT_REV2_ANON_2026-08-19.pdf > paper03_rev2_pdfinfo.txt
          sha256sum PAPER03_MANUSCRIPT_REV2_ANON_2026-08-19.pdf > paper03_rev2_sha256.txt
      - name: Upload revised manuscript package
        uses: actions/upload-artifact@v4
        with:
          name: paper03-manuscript-rev2-figure1-polished
          path: |
            experiments/01-vanishing-absorber/PAPER03_MANUSCRIPT_REV2_ANON_2026-08-19.tex
            experiments/01-vanishing-absorber/PAPER03_MANUSCRIPT_REV2_ANON_2026-08-19.pdf
            experiments/01-vanishing-absorber/paper03_rev2_pdfinfo.txt
            experiments/01-vanishing-absorber/paper03_rev2_sha256.txt
          if-no-files-found: error
