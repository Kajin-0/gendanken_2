name: Paper 02 HgCdTe kernel method record

on:
  push:
    branches:
      - agent/publication-mining-roadmap
    paths:
      - 'experiments/01-vanishing-absorber/numerics/paper02_extract_kernel_method_record.py'
      - 'experiments/01-vanishing-absorber/numerics/hgcdte_ramo_four_color_gradient_prediction.py'
      - '.github/workflows/paper02-kernel-method-record.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Extract exact method record
        working-directory: experiments/01-vanishing-absorber/numerics
        run: python paper02_extract_kernel_method_record.py
      - name: Persist record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/01-vanishing-absorber/PAPER02_HGCDTE_KERNEL_METHOD_RECORD_2026-08-15.md
          if git diff --cached --quiet; then
            echo 'Kernel method record already current.'
          else
            git commit -m 'Record exact HgCdTe kernel method'
            git push
          fi
