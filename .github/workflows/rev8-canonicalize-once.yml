name: Canonicalize Rev8 once

on:
  push:
    branches:
      - agent/canonicalize-rev8-anonymous
    paths:
      - '.github/workflows/rev8-canonicalize-once.yml'

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fail-closed Rev8 recovery update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/rev8_canonicalize_once.py')
          s=p.read_text(encoding='utf-8')
          patches=[
            ("('manuscript_history/MANUSCRIPT_REV7_ANON_2026-08-11.tex.gz.b64.part06',",
             "('manuscript_history/MANUSCRIPT_REV8_ANON_2026-08-11.tex.gz.b64.part06',"),
            ("s=must_replace(s,'manuscript_history/MANUSCRIPT_REV7_ANON_2026-08-11.tex.gz.b64.part06',",
             "s=must_replace(s,'manuscript_history/MANUSCRIPT_REV8_ANON_2026-08-11.tex.gz.b64.part06',"),
          ]
          for old,new in patches:
              if s.count(old) != 1:
                  raise SystemExit(f'expected one stale snapshot assertion {old!r}, found {s.count(old)}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          python tools/rev8_canonicalize_once.py
      - name: Verify permanent extractor reconstructs exact Rev8
        shell: bash
        run: |
          python tools/extract_manuscript_baseline.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('experiments/01-vanishing-absorber/MANUSCRIPT_CURRENT.tex')
          b=p.read_bytes()
          assert hashlib.sha256(b).hexdigest()=='28eb3de954d50046f177e06e4b54eb1812414c03a1d53a933904f99fb3c49ba9'
          assert len(b)==81816
          assert len(b.decode('utf-8').splitlines())==1023
          print('PASS: permanent extractor reconstructs exact anonymous Rev8')
          PY
      - name: Run privacy and preservation self-checks
        shell: bash
        run: |
          python tools/check_privacy_policy.py
          python tools/check_manuscript_preservation.py \
            --candidate experiments/01-vanishing-absorber/MANUSCRIPT_REV8_ANON_2026-08-11.tex \
            --base experiments/01-vanishing-absorber/MANUSCRIPT_REV8_ANON_2026-08-11.tex \
            --manifest experiments/01-vanishing-absorber/MANUSCRIPT_BASELINE.json
      - name: Commit pointer-only Rev8 canonicalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            AGENTS.md README.md \
            experiments/01-vanishing-absorber/CURRENT_STATE_LIVE.md \
            experiments/01-vanishing-absorber/MANUSCRIPT_BASELINE.json \
            experiments/01-vanishing-absorber/MANUSCRIPT_BASELINE.md \
            experiments/01-vanishing-absorber/MANUSCRIPT_CURRENT.md \
            tools/extract_manuscript_baseline.py
          git diff --cached --quiet && { echo 'No pointer update to commit'; exit 0; }
          git commit -m 'Make anonymous Rev8 the canonical recovery baseline'
          git push
