name: Build Rev7 candidate once

on:
  push:
    paths:
      - '.github/workflows/rev7-build-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate corrupted Rev7 snapshot block
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('experiments/01-vanishing-absorber/manuscript_history/MANUSCRIPT_REV7_ANON_2026-08-11.tex.gz.b64.part04')
          s=p.read_text(encoding='ascii').strip()
          expected=[
            '7c08fdd5ea217fa114a9a65f277bbe1f8802935d38716b6cb6e51b6e24126a93',
            'cd88e048d3083d4b4953108110211a5eda9119e5e0a336c8e4dc455eab6c7950',
            '75dd8a80daf12e603a99d97147a716fff6679b69bf8e0401e1ae681e19ae0292',
            'bf9eec201a8a8f6f742eac06f59ab0a2b60f2d3c7faa3dd0d1f2690b24319d7d',
            'be1ba9a8aabc87a678766a9aeca534a96f1007f99dd05d06d526a1996926355d',
            'ee80d75e427d583d6c5aae56b272f036f940d9684a26c298dd784236113ea0d3',
            '1c251c1bc0ddf70efb468232017c289c622d909114dc8705c70040b6bcec7199',
            '96ae453194082554b965b1b6d6471ad81d0c70bbf3f012c2862aded7f964877a',
            'cf892a58684ddd554be7a087974b76d8aafc76e4450a919b9feaf18180172a1b',
            'b771ed505b4f433889f4aafe20b63c57b92b1f973c4f7a1a7673349e11b8b767',
            'ee2d29c60c906e733b95c3cb2f8381f11eb3b5acbc21eb0a8c52656d168bdead',
            'f7c3a0d782f8704493c6dfc25a3e5c61d12e02db132c8982856059befabb3f87',
          ]
          print('length',len(s))
          bad=[]
          for i,want in enumerate(expected):
            chunk=s[i*500:(i+1)*500]
            got=hashlib.sha256(chunk.encode()).hexdigest()
            print(i*500, got, 'OK' if got==want else 'BAD')
            if got!=want:
              bad.append(i)
              print('BAD_CHUNK_REPR=',repr(chunk))
          if not bad:
            raise SystemExit('No 500-character mismatch found')
          print('bad_blocks',bad)
          PY
