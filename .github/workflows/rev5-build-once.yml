name: Build Rev5 candidate once

on:
  push:
    paths:
      - '.github/workflows/rev5-build-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct exact anonymous Rev5 candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          exp = Path('experiments/01-vanishing-absorber')
          parts = sorted((exp / 'manuscript_history').glob('MANUSCRIPT_REV5_ANON_2026-08-11.tex.gz.b64.part*'))
          if len(parts) != 6:
              raise SystemExit(f'expected 6 Rev5 snapshot parts, found {len(parts)}')
          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
          packed = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(packed).hexdigest() != 'ef1a05707690753bd3affd24909e1bedf6ad0681e409f09f92e479d6c0d22a65':
              raise SystemExit('Rev5 gzip hash mismatch')
          source = gzip.decompress(packed)
          if hashlib.sha256(source).hexdigest() != '9d9c4686a152dcdbbfebae1db00a22f5cfd743b5948f825e79ba2acd75b812fb':
              raise SystemExit('Rev5 source hash mismatch')
          text = source.decode('utf-8')
          if len(text.splitlines()) != 863:
              raise SystemExit('Rev5 line-count mismatch')
          if r'\author{Anonymous}' not in text or 'pdfauthor={Anonymous}' not in text:
              raise SystemExit('Rev5 anonymous author metadata missing')
          out = exp / 'MANUSCRIPT_REV5_ANON_2026-08-11.tex'
          out.write_bytes(source)
          print('Rev5 source verified:', hashlib.sha256(source).hexdigest())
          PY

      - name: Run Rev5 mathematical regression
        run: |
          python -m pip install --disable-pip-version-check -q numpy
          python experiments/01-vanishing-absorber/numerics/rev5_review_regression.py

      - name: Commit exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/01-vanishing-absorber/MANUSCRIPT_REV5_ANON_2026-08-11.tex
          if git diff --cached --quiet; then
            echo 'Exact Rev5 candidate already committed.'
            exit 0
          fi
          git commit -m 'Add exact anonymous Rev5 manuscript candidate'
          git push
