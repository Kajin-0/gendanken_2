name: Paper 02 full-channel rejection comparison

on:
  push:
    branches: [agent/publication-mining-roadmap]
    paths:
      - 'experiments/01-vanishing-absorber/PAPER02_FULL_CHANNEL_REJECTION_GATE_2026-08-16.md'
      - 'experiments/01-vanishing-absorber/numerics/paper02_full_channel_rejection.py'
      - '.github/workflows/paper02-full-channel-rejection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/publication-mining-roadmap}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy scipy matplotlib
      - name: Run comparison
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python -m py_compile paper02_full_channel_rejection.py
          python paper02_full_channel_rejection.py
          python - <<'PY'
          import json
          x=json.load(open('results/paper02_full_channel_rejection_summary.json'))
          assert all(r['full_optimizer_success'] for r in x['rows'])
          print('1 GHz',x['through_1ghz'])
          print('3 GHz',x['through_3ghz'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper02-full-channel-rejection
          path: |
            experiments/01-vanishing-absorber/numerics/results/paper02_full_channel_rejection_summary.json
            experiments/01-vanishing-absorber/numerics/results/paper02_full_channel_rejection_rows.csv
          if-no-files-found: error
