name: Paper 02 manuscript Rev7 model-uncertainty gate

on:
  push:
    branches:
      - agent/publication-mining-roadmap
    paths:
      - 'experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_REV6_ANON_2026-08-16.tex'
      - 'experiments/01-vanishing-absorber/PAPER02_SUPPLEMENT_REV6_ANON_2026-08-16.tex'
      - 'experiments/01-vanishing-absorber/PAPER02_REFERENCES_REV4.bib'
      - 'experiments/01-vanishing-absorber/PAPER02_SAME_FREQUENCY_STATISTICAL_SNIPPET.tex'
      - 'experiments/01-vanishing-absorber/tools/build_paper02_rev7.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_covariance_geometry_stress.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_kernel_misspecification_stress.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_exact_affine_depth_control.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_kernel_nuisance_tangent_projection_v2.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_signed_kernel_mode_thresholds.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_exact_planar_continuum_crosscheck.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_build_figure_bundle.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_independent_velocity_profiles.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_kernel_tail_ablation.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_bias_bound_linearization.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_end_to_end_rejection_snr.py'
      - '.github/workflows/paper02-manuscript-rev7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-compile-science-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/publication-mining-roadmap
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical and plotting dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy matplotlib

      - name: Re-execute exact planar continuum check
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python -m py_compile paper02_exact_planar_continuum_crosscheck.py
          python paper02_exact_planar_continuum_crosscheck.py
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('results/paper02_exact_planar_continuum_crosscheck_summary.json').read_text())
          assert x['comparison']['overall_pass_against_existing_tolerances'] is True
          assert 'POST-HOC' in x['status']
          assert abs(x['point_controls']['outside_depletion']['D_eff_m2_per_s']) < 1e-7
          assert x['point_controls']['inside_depletion']['D_eff_m2_per_s'] > 0
          print('PASS exact continuum')
          PY

      - name: Re-execute covariance geometry stress
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python -m py_compile paper02_covariance_geometry_stress.py
          python paper02_covariance_geometry_stress.py
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('paper02_covariance_geometry_summary.json').read_text())
          s=x['same_frequency_summary']
          assert s['100000000']['hidden_risk_cases'] == []
          assert len(s['500000000']['hidden_risk_cases']) == 12
          assert len(s['1000000000']['hidden_risk_cases']) == 12
          d100=s['100000000']['D_eff_range_m2_per_s']
          assert d100[0] < 1.7e-3 and d100[1] > 2.6e-3
          m=x['multi_frequency_summary']['3000000000']
          assert m['max_required_snr_db'] - m['iid_required_snr_db'] < 1.2
          print('PASS covariance geometry')
          PY

      - name: Re-execute broad kernel misspecification stress
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python -m py_compile paper02_kernel_misspecification_stress.py
          python paper02_kernel_misspecification_stress.py
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('paper02_kernel_misspecification_stress_summary.json').read_text())
          s=x['summary']
          assert abs(s['uniform_velocity_null']['nominal']['D100']) < 1e-8
          rows=x['rows']
          r=next(q for q in rows if q['transport']=='uniform_velocity_null' and q['case']=='wavelength_linear_pm1nm')
          assert r['D100_m2_per_s'] > 0.08
          assert r['fit100_rel'] < 1e-5
          assert r['hidden_100'] is True
          print('PASS broad kernel misspecification')
          PY

      - name: Re-execute exact affine depth control
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python -m py_compile paper02_exact_affine_depth_control.py
          python paper02_exact_affine_depth_control.py
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('paper02_exact_affine_depth_control_summary.json').read_text())
          assert x['max_abs_D_eff_m2_per_s'] < 1e-10
          assert x['max_relative_w_error'] < 1e-10
          assert max(r['max_abs_mean_depth_shift_nm'] for r in x['rows']) > 17.0
          print('PASS exact affine control')
          PY

      - name: Re-execute frequency-aware local kernel nuisance projection
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python -m py_compile paper02_kernel_nuisance_tangent_projection_v2.py
          python paper02_kernel_nuisance_tangent_projection_v2.py
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('paper02_kernel_nuisance_tangent_projection_v2_summary.json').read_text())
          rows=x['rows']
          for f in (100e6,500e6,1e9):
              for mode in ('common','linear','curvature'):
                  r=next(q for q in rows if q['frequency_hz']==f and q['mode']==mode)
                  assert r['asymptotic_positive_D_detectable_before_rejection'] is True
                  assert r['relative_D_linearization_error_plus'] < 0.01
                  assert r['relative_D_linearization_error_minus'] < 0.01
          rlin=next(q for q in rows if q['frequency_hz']==100e6 and q['mode']=='linear')
          rcurv=next(q for q in rows if q['frequency_hz']==100e6 and q['mode']=='curvature')
          assert rlin['dD_d_eps_m2_per_s_per_nm'] > 0
          assert rcurv['dD_d_eps_m2_per_s_per_nm'] < 0
          assert rlin['asymptotic_Sreject_over_SD'] > 70
          assert rcurv['asymptotic_Sreject_over_SD'] > 13
          print('PASS local kernel nuisance projection')
          PY

      - name: Re-execute signed kernel-mode thresholds
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python -m py_compile paper02_signed_kernel_mode_thresholds.py
          python paper02_signed_kernel_mode_thresholds.py
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('paper02_signed_kernel_mode_thresholds_summary.json').read_text())
          s=x['summary']
          lin=s['linear']['matched_target']
          cur=s['curvature']['matched_target']
          assert lin is not None and cur is not None
          assert lin['hidden_100'] is True and cur['hidden_100'] is True
          assert abs(lin['magnitude_nm']-0.0299713) < 1e-5
          assert abs(cur['magnitude_nm']-0.00294205) < 1e-6
          assert s['linear']['positive_D_sign'] == 1
          assert s['curvature']['positive_D_sign'] == -1
          print('PASS signed kernel thresholds')
          PY

      - name: Regenerate canonical figure data
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python paper02_independent_velocity_profiles.py
          python paper02_kernel_tail_ablation.py
          python paper02_bias_bound_linearization.py
          python paper02_end_to_end_rejection_snr.py
          python paper02_build_figure_bundle.py

      - name: Build Rev7 from frozen Rev6 blobs
        working-directory: experiments/01-vanishing-absorber
        run: |
          python -m py_compile tools/build_paper02_rev7.py
          python tools/build_paper02_rev7.py

      - name: Guard Rev7 scope anonymity and statistical semantics
        working-directory: experiments/01-vanishing-absorber
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          main=Path('PAPER02_MANUSCRIPT_REV7_ANON_2026-08-16.tex').read_text()
          supp=Path('PAPER02_SUPPLEMENT_REV7_ANON_2026-08-16.tex').read_text()
          snippet=Path('PAPER02_SAME_FREQUENCY_STATISTICAL_SNIPPET.tex').read_text()
          assert main.count(r'\author{Anonymous}') == 1
          assert supp.count(r'\author{Anonymous}') == 1
          assert r'\section{Measurement covariance and optical-model uncertainty}' in main
          assert 'one-mode rejection precedes positive-$D$ detection in all 12 cases' in main
          assert r'A=0.02997\,\mathrm{nm}' in main
          assert r'A=0.00294\,\mathrm{nm}' in main
          assert 'not instrument calibration specifications or empirical error bars' in main
          assert 'generalized least squares, nuisance projection, or Schur-complement information' in main
          assert r'\section{Covariance and optical-kernel uncertainty stresses}' in supp
          assert 'not wavelength-meter specifications' in supp
          assert 'frequency-aware ``v2'' nuisance projection' in supp
          assert '100' in snippet and '500' in snippet and '1000' in snippet
          for pat in (r'for the first time',r'first-ever',r'fundamental new mechanism',r'universal false diffusion',r'first demonstration'):
              assert not re.search(pat,main,re.I),pat
              assert not re.search(pat,supp,re.I),pat
          print('PASS Rev7 scope/privacy/epistemic guards')
          PY

      - name: Persist Rev7 sources safely
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch='agent/publication-mining-roadmap'
          for attempt in 1 2 3 4 5; do
            git fetch origin "${branch}"
            git reset --hard "origin/${branch}"
            (cd experiments/01-vanishing-absorber && python tools/build_paper02_rev7.py)
            git add \
              experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_REV7_ANON_2026-08-16.tex \
              experiments/01-vanishing-absorber/PAPER02_SUPPLEMENT_REV7_ANON_2026-08-16.tex
            if git diff --cached --quiet; then
              echo 'Rev7 sources already current.'
              break
            fi
            git commit -m 'Build Paper 02 Rev7 model uncertainty revision'
            if git push origin "HEAD:${branch}"; then
              echo 'Rev7 sources persisted.'
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo 'Unable to persist Rev7 after five branch-race retries.'
              exit 1
            fi
            echo "Push attempt ${attempt} lost branch race; rebuilding from latest head."
          done
          (cd experiments/01-vanishing-absorber && python tools/build_paper02_rev7.py)
          if ! git diff --quiet -- \
            experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_REV7_ANON_2026-08-16.tex \
            experiments/01-vanishing-absorber/PAPER02_SUPPLEMENT_REV7_ANON_2026-08-16.tex; then
            echo 'Persisted Rev7 differs from deterministic rebuild.'
            exit 1
          fi

      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-extra texlive-publishers texlive-science poppler-utils

      - name: Compile Rev7 main manuscript
        working-directory: experiments/01-vanishing-absorber
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error PAPER02_MANUSCRIPT_REV7_ANON_2026-08-16.tex

      - name: Compile Rev7 Supplemental Material
        working-directory: experiments/01-vanishing-absorber
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error PAPER02_SUPPLEMENT_REV7_ANON_2026-08-16.tex

      - name: Check unresolved references and citations
        working-directory: experiments/01-vanishing-absorber
        run: |
          for log in PAPER02_MANUSCRIPT_REV7_ANON_2026-08-16.log PAPER02_SUPPLEMENT_REV7_ANON_2026-08-16.log; do
            if grep -E "LaTeX Warning: (Citation|Reference).*undefined|There were undefined references|There were undefined citations" "$log"; then
              echo "Unresolved citation/reference detected in $log"
              exit 1
            fi
          done

      - name: Verify packaged Rev7 source independently compiles
        working-directory: experiments/01-vanishing-absorber
        run: |
          set -euo pipefail
          pkg="$(mktemp -d)"
          mkdir -p "$pkg/numerics/paper02_figures"
          cp PAPER02_MANUSCRIPT_REV7_ANON_2026-08-16.tex "$pkg/"
          cp PAPER02_SUPPLEMENT_REV7_ANON_2026-08-16.tex "$pkg/"
          cp PAPER02_REFERENCES_REV4.bib "$pkg/"
          cp PAPER02_SAME_FREQUENCY_STATISTICAL_SNIPPET.tex "$pkg/"
          cp numerics/paper02_figures/*.pdf "$pkg/numerics/paper02_figures/"
          (cd "$pkg" && latexmk -pdf -interaction=nonstopmode -halt-on-error PAPER02_MANUSCRIPT_REV7_ANON_2026-08-16.tex && latexmk -pdf -interaction=nonstopmode -halt-on-error PAPER02_SUPPLEMENT_REV7_ANON_2026-08-16.tex)
          echo 'PASS packaged Rev7 source compile'

      - name: Report compiled artifacts
        working-directory: experiments/01-vanishing-absorber
        run: |
          pdfinfo PAPER02_MANUSCRIPT_REV7_ANON_2026-08-16.pdf | grep -E 'Pages|Title|Author' || true
          pdfinfo PAPER02_SUPPLEMENT_REV7_ANON_2026-08-16.pdf | grep -E 'Pages|Title|Author' || true
          sha256sum PAPER02_MANUSCRIPT_REV7_ANON_2026-08-16.pdf PAPER02_SUPPLEMENT_REV7_ANON_2026-08-16.pdf

      - name: Upload Rev7 manuscript and robustness package
        uses: actions/upload-artifact@v4
        with:
          name: paper02-manuscript-rev7-package
          path: |
            experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_REV7_ANON_2026-08-16.pdf
            experiments/01-vanishing-absorber/PAPER02_SUPPLEMENT_REV7_ANON_2026-08-16.pdf
            experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_REV7_ANON_2026-08-16.tex
            experiments/01-vanishing-absorber/PAPER02_SUPPLEMENT_REV7_ANON_2026-08-16.tex
            experiments/01-vanishing-absorber/PAPER02_REFERENCES_REV4.bib
            experiments/01-vanishing-absorber/PAPER02_SAME_FREQUENCY_STATISTICAL_SNIPPET.tex
            experiments/01-vanishing-absorber/numerics/results/PAPER02_EXACT_PLANAR_CONTINUUM_CROSSCHECK.md
            experiments/01-vanishing-absorber/numerics/paper02_covariance_geometry_summary.json
            experiments/01-vanishing-absorber/numerics/paper02_kernel_misspecification_stress_summary.json
            experiments/01-vanishing-absorber/numerics/paper02_exact_affine_depth_control_summary.json
            experiments/01-vanishing-absorber/numerics/paper02_kernel_nuisance_tangent_projection_v2_summary.json
            experiments/01-vanishing-absorber/numerics/paper02_signed_kernel_mode_thresholds_summary.json
            experiments/01-vanishing-absorber/numerics/paper02_figures/*.pdf
          if-no-files-found: error
