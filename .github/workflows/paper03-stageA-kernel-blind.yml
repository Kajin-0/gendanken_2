name: Paper 03 Stage A kernel-aware blind gate

on:
  pull_request:
    paths:
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_kernel_blind_gate.py'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_resolvent.py'
      - 'experiments/01-vanishing-absorber/numerics/realistic_geometry_closure_stress.py'
      - '.github/workflows/paper03-stageA-kernel-blind.yml'
  push:
    branches:
      - agent/paper03-combined-physics
    paths:
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_kernel_blind_gate.py'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_resolvent.py'
      - 'experiments/01-vanishing-absorber/numerics/realistic_geometry_closure_stress.py'
      - '.github/workflows/paper03-stageA-kernel-blind.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-blind-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Run kernel-aware blind development gate
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python -m py_compile paper03_stageA_kernel_blind_gate.py
          python paper03_stageA_kernel_blind_gate.py \
            --output paper03_stageA_kernel_blind_gate.json

      - name: Verify regression, numerical gates, and non-claim status
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(Path('paper03_stageA_kernel_blind_gate.json').read_text())
          assert r['science_interpretation_ready'] is False
          assert r['forward_model']['self_consistent_semiconductor'] is False
          assert r['kernel_model']['known_one_mode_regression']['contrast_normalized_residual'] < 1e-9
          assert r['numerical_checks']['source_quadrature_13_to_17']['passed'] is True
          assert r['numerical_checks']['finite_201']['solver_diagnostics']['max_linear_relative_residual'] < 1e-8
          assert r['numerical_checks']['planar_201']['solver_diagnostics']['max_linear_relative_residual'] < 1e-8
          print(json.dumps(r['numerical_checks']['source_quadrature_13_to_17'], indent=2))
          print(json.dumps(r['same_physics_planar_reference'], indent=2))
          for label, rows in r['kernel_aware_one_mode_fits'].items():
              print(label)
              for row in rows:
                  print(row['frequency_hz'], row['central4']['contrast_normalized_residual'], row['all6']['contrast_normalized_residual'])
          PY

      - name: Upload kernel-aware development record
        uses: actions/upload-artifact@v4
        with:
          name: paper03-stageA-kernel-blind-gate
          path: experiments/01-vanishing-absorber/numerics/paper03_stageA_kernel_blind_gate.json
          if-no-files-found: error
