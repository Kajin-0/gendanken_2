name: Paper 03 Stage A regime screen

on:
  pull_request:
    paths:
      - 'experiments/01-vanishing-absorber/PAPER03_STAGEA_REGIME_MAP_PREDECLARATION_2026-08-17.md'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_regime_screen.py'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_resolvent.py'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_kernel_blind_gate.py'
      - '.github/workflows/paper03-stageA-regime-screen.yml'
  push:
    branches:
      - agent/paper03-combined-physics
    paths:
      - 'experiments/01-vanishing-absorber/PAPER03_STAGEA_REGIME_MAP_PREDECLARATION_2026-08-17.md'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_regime_screen.py'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_resolvent.py'
      - 'experiments/01-vanishing-absorber/numerics/paper03_stageA_kernel_blind_gate.py'
      - '.github/workflows/paper03-stageA-regime-screen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regime-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Run predeclared 60-point screen
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python -m py_compile paper03_stageA_regime_screen.py
          python paper03_stageA_regime_screen.py \
            --output paper03_stageA_regime_screen.json

      - name: Verify predeclared screen structure
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('paper03_stageA_regime_screen.json').read_text())
          assert r['science_interpretation_ready'] is False
          assert r['counts']['declared_points'] == 60
          assert r['counts']['frequency_rows'] == 180
          assert r['numerical']['grid'] == [81,61]
          assert r['numerical']['lateral_quadrature'] == 9
          assert r['analytic_statistical_coordinate']['is_bootstrap'] is False
          assert 1 <= len(r['predeclared_selected_points']) <= 8
          for p in r['screen_points']:
              d = p['solver_diagnostics']
              assert d['max_linear_relative_residual'] < 1e-8
              assert d['committor_relative_residual'] < 1e-8
              if p['lifetime_s'] == 'inf':
                  assert d['dc_committor_ramo_max_abs_error'] < 1e-8
          print(json.dumps(r['counts'], indent=2))
          print(json.dumps(r['predeclared_selected_points'], indent=2))
          PY

      - name: Upload regime-screen record
        uses: actions/upload-artifact@v4
        with:
          name: paper03-stageA-regime-screen
          path: experiments/01-vanishing-absorber/numerics/paper03_stageA_regime_screen.json
          if-no-files-found: error
