name: Validate Rev9 candidate once

on:
  push:
    branches: [agent/rev9-adversarial-surgical]
    paths: ['.github/workflows/rev9-build-once.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check -q numpy
      - name: Verify exact Rev9 source and snapshot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib
          root=Path('experiments/01-vanishing-absorber')
          p=root/'MANUSCRIPT_REV9_ANON_2026-08-11.tex'
          b=p.read_bytes(); text=b.decode()
          assert hashlib.sha256(b).hexdigest()=='df62813f764f051684ec52162095a5103296b71da1549b4c96829b0168fa1ce4'
          assert len(b)==92749 and len(text.splitlines())==1086
          assert r'\author{Anonymous}' in text and 'pdfauthor={Anonymous}' in text
          parts=sorted((root/'manuscript_history').glob('MANUSCRIPT_REV9_ANON_2026-08-11.tex.gz.b64.part*'))
          assert len(parts)==7
          enc=''.join(x.read_text(encoding='ascii').strip() for x in parts)
          packed=base64.b64decode(enc,validate=True)
          assert hashlib.sha256(packed).hexdigest()=='15b434edbd72a5217f6183e45a537350683755fd98ec7f39716a21e5f601cdb9'
          assert gzip.decompress(packed)==b
          print('PASS exact Rev9 source/snapshot')
          PY
      - name: Run Rev9 mathematical regression
        run: python experiments/01-vanishing-absorber/numerics/rev9_review_regression.py
      - name: Run privacy gate
        run: python tools/check_privacy_policy.py
      - name: Run preservation gate against canonical Rev8
        run: python tools/check_manuscript_preservation.py --candidate experiments/01-vanishing-absorber/MANUSCRIPT_REV9_ANON_2026-08-11.tex --base experiments/01-vanishing-absorber/MANUSCRIPT_REV8_ANON_2026-08-11.tex --manifest experiments/01-vanishing-absorber/MANUSCRIPT_BASELINE.json
