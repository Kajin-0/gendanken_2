name: Paper 02 geometry refined sweep

on:
  push:
    branches:
      - agent/publication-mining-roadmap
    paths:
      - 'experiments/01-vanishing-absorber/numerics/paper02_geometry_parameter_sweep.py'
      - 'experiments/01-vanishing-absorber/numerics/realistic_geometry_closure_stress.py'
      - 'experiments/01-vanishing-absorber/numerics/hgcdte_ramo_four_color_gradient_prediction.py'
      - '.github/workflows/paper02-geometry-refined.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refined-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Run refined quick grid
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python paper02_geometry_parameter_sweep.py \
            --tier quick \
            --nx 121 \
            --nz 91 \
            --nx-src 13 \
            --nz-src 41 \
            --ds-um 0.020 \
            --output-csv paper02_geometry_refined.csv \
            --output-summary paper02_geometry_refined_summary.json

      - name: Print summary
        working-directory: experiments/01-vanishing-absorber/numerics
        run: cat paper02_geometry_refined_summary.json

      - name: Upload refined outputs
        uses: actions/upload-artifact@v4
        with:
          name: paper02-geometry-refined
          path: |
            experiments/01-vanishing-absorber/numerics/paper02_geometry_refined.csv
            experiments/01-vanishing-absorber/numerics/paper02_geometry_refined_summary.json
          if-no-files-found: error
