name: Paper 02 manuscript Rev7 v2 full gate

on:
  push:
    branches: [agent/publication-mining-roadmap]
    paths:
      - 'experiments/01-vanishing-absorber/tools/build_paper02_rev7_v2.py'
      - 'experiments/01-vanishing-absorber/PAPER02_REFERENCES_REV7.bib'
      - 'experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_REV6_ANON_2026-08-16.tex'
      - 'experiments/01-vanishing-absorber/PAPER02_SUPPLEMENT_REV6_ANON_2026-08-16.tex'
      - 'experiments/01-vanishing-absorber/numerics/paper02_covariance_geometry_stress.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_kernel_misspecification_stress.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_exact_affine_depth_control.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_kernel_nuisance_tangent_projection_v2.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_signed_kernel_mode_thresholds.py'
      - 'experiments/01-vanishing-absorber/numerics/paper02_exact_planar_continuum_crosscheck.py'
      - '.github/workflows/paper02-manuscript-rev7-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/publication-mining-roadmap
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy matplotlib

      - name: Recompute exact continuum and uncertainty suite
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python paper02_exact_planar_continuum_crosscheck.py
          python paper02_covariance_geometry_stress.py
          python paper02_kernel_misspecification_stress.py
          python paper02_exact_affine_depth_control.py
          python paper02_kernel_nuisance_tangent_projection_v2.py
          python paper02_signed_kernel_mode_thresholds.py

      - name: Validate recomputed scientific invariants
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python -c "import json; x=json.load(open('results/paper02_exact_planar_continuum_crosscheck_summary.json')); assert x['comparison']['overall_pass_against_existing_tolerances']; assert abs(x['point_controls']['outside_depletion']['D_eff_m2_per_s'])<1e-7; assert x['point_controls']['inside_depletion']['D_eff_m2_per_s']>0"
          python -c "import json; x=json.load(open('paper02_covariance_geometry_summary.json')); s=x['same_frequency_summary']; assert s['100000000']['hidden_risk_cases']==[]; assert len(s['500000000']['hidden_risk_cases'])==12; assert len(s['1000000000']['hidden_risk_cases'])==12; assert s['100000000']['D_eff_range_m2_per_s'][0]<1.7e-3; assert s['100000000']['D_eff_range_m2_per_s'][1]>2.6e-3"
          python -c "import json; x=json.load(open('paper02_kernel_misspecification_stress_summary.json')); r=next(q for q in x['rows'] if q['transport']=='uniform_velocity_null' and q['case']=='wavelength_linear_pm1nm'); assert r['D100_m2_per_s']>0.08; assert r['fit100_rel']<1e-5; assert r['hidden_100']"
          python -c "import json; x=json.load(open('paper02_exact_affine_depth_control_summary.json')); assert x['max_abs_D_eff_m2_per_s']<1e-10; assert x['max_relative_w_error']<1e-10"
          python -c "import json; x=json.load(open('paper02_kernel_nuisance_tangent_projection_v2_summary.json')); rs=x['rows']; assert all(r['asymptotic_positive_D_detectable_before_rejection'] for r in rs); assert all(r['relative_D_linearization_error_plus']<0.01 and r['relative_D_linearization_error_minus']<0.01 for r in rs)"
          python -c "import json; x=json.load(open('paper02_signed_kernel_mode_thresholds_summary.json')); l=x['summary']['linear']['matched_target']; c=x['summary']['curvature']['matched_target']; assert l['hidden_100'] and c['hidden_100']; assert abs(l['magnitude_nm']-0.0299713)<1e-5; assert abs(c['magnitude_nm']-0.00294205)<1e-6"

      - name: Regenerate canonical figure data
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          python paper02_independent_velocity_profiles.py
          python paper02_kernel_tail_ablation.py
          python paper02_bias_bound_linearization.py
          python paper02_end_to_end_rejection_snr.py
          python paper02_build_figure_bundle.py

      - name: Build Rev7 v2 from exact frozen Rev6 blobs
        working-directory: experiments/01-vanishing-absorber
        run: |
          python -m py_compile tools/build_paper02_rev7_v2.py
          python tools/build_paper02_rev7_v2.py

      - name: Guard manuscript scope priority bibliography and anonymity
        working-directory: experiments/01-vanishing-absorber
        run: |
          python -c "from pathlib import Path; m=Path('PAPER02_MANUSCRIPT_REV7_ANON_2026-08-16.tex').read_text(); s=Path('PAPER02_SUPPLEMENT_REV7_ANON_2026-08-16.tex').read_text(); assert m.count(r'\\author{Anonymous}')==1 and s.count(r'\\author{Anonymous}')==1; assert r'\\cite{ashry2003diffusion}' in m; assert 'PAPER02_REFERENCES_REV7' in m and 'PAPER02_REFERENCES_REV7' in s; assert 'not instrument calibration specifications or empirical error bars' in m; assert 'not wavelength-meter specifications' in s; assert 'does not yet propagate uncertainty in the supplied optical kernels' not in m"
          python -c "from pathlib import Path; import re; t=Path('PAPER02_MANUSCRIPT_REV7_ANON_2026-08-16.tex').read_text()+Path('PAPER02_SUPPLEMENT_REV7_ANON_2026-08-16.tex').read_text(); bad=[p for p in ('first-ever','for the first time','fundamental new mechanism','universal false diffusion','first demonstration') if re.search(p,t,re.I)]; assert not bad,bad"

      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-extra texlive-publishers texlive-science poppler-utils

      - name: Compile main and supplement
        working-directory: experiments/01-vanishing-absorber
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error PAPER02_MANUSCRIPT_REV7_ANON_2026-08-16.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error PAPER02_SUPPLEMENT_REV7_ANON_2026-08-16.tex

      - name: Check unresolved citations and references
        working-directory: experiments/01-vanishing-absorber
        run: |
          for log in PAPER02_MANUSCRIPT_REV7_ANON_2026-08-16.log PAPER02_SUPPLEMENT_REV7_ANON_2026-08-16.log; do
            if grep -E "LaTeX Warning: (Citation|Reference).*undefined|There were undefined references|There were undefined citations" "$log"; then exit 1; fi
          done

      - name: Independently compile packaged sources
        working-directory: experiments/01-vanishing-absorber
        run: |
          set -euo pipefail
          pkg="$(mktemp -d)"
          mkdir -p "$pkg/numerics/paper02_figures"
          cp PAPER02_MANUSCRIPT_REV7_ANON_2026-08-16.tex PAPER02_SUPPLEMENT_REV7_ANON_2026-08-16.tex PAPER02_REFERENCES_REV7.bib PAPER02_SAME_FREQUENCY_STATISTICAL_SNIPPET.tex "$pkg/"
          cp numerics/paper02_figures/*.pdf "$pkg/numerics/paper02_figures/"
          (cd "$pkg" && latexmk -pdf -interaction=nonstopmode -halt-on-error PAPER02_MANUSCRIPT_REV7_ANON_2026-08-16.tex && latexmk -pdf -interaction=nonstopmode -halt-on-error PAPER02_SUPPLEMENT_REV7_ANON_2026-08-16.tex)

      - name: Report artifact metadata
        working-directory: experiments/01-vanishing-absorber
        run: |
          pdfinfo PAPER02_MANUSCRIPT_REV7_ANON_2026-08-16.pdf | grep -E 'Pages|Title|Author' || true
          pdfinfo PAPER02_SUPPLEMENT_REV7_ANON_2026-08-16.pdf | grep -E 'Pages|Title|Author' || true
          sha256sum PAPER02_MANUSCRIPT_REV7_ANON_2026-08-16.pdf PAPER02_SUPPLEMENT_REV7_ANON_2026-08-16.pdf

      - name: Persist deterministic Rev7 v2 sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch='agent/publication-mining-roadmap'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            (cd experiments/01-vanishing-absorber && python tools/build_paper02_rev7_v2.py)
            git add experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_REV7_ANON_2026-08-16.tex experiments/01-vanishing-absorber/PAPER02_SUPPLEMENT_REV7_ANON_2026-08-16.tex
            if git diff --cached --quiet; then break; fi
            git commit -m 'Build Paper 02 Rev7 model uncertainty manuscript'
            if git push origin "HEAD:$branch"; then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
          done

      - name: Upload Rev7 v2 package
        uses: actions/upload-artifact@v4
        with:
          name: paper02-manuscript-rev7-v2-package
          path: |
            experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_REV7_ANON_2026-08-16.pdf
            experiments/01-vanishing-absorber/PAPER02_SUPPLEMENT_REV7_ANON_2026-08-16.pdf
            experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_REV7_ANON_2026-08-16.tex
            experiments/01-vanishing-absorber/PAPER02_SUPPLEMENT_REV7_ANON_2026-08-16.tex
            experiments/01-vanishing-absorber/PAPER02_REFERENCES_REV7.bib
            experiments/01-vanishing-absorber/numerics/paper02_covariance_geometry_summary.json
            experiments/01-vanishing-absorber/numerics/paper02_kernel_misspecification_stress_summary.json
            experiments/01-vanishing-absorber/numerics/paper02_exact_affine_depth_control_summary.json
            experiments/01-vanishing-absorber/numerics/paper02_kernel_nuisance_tangent_projection_v2_summary.json
            experiments/01-vanishing-absorber/numerics/paper02_signed_kernel_mode_thresholds_summary.json
          if-no-files-found: error
