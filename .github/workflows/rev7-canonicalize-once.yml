name: Canonicalize Rev7 once

on:
  push:
    paths:
      - '.github/workflows/rev7-canonicalize-once.yml'

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fail-closed Rev7 pointer update
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/rev7_canonicalize_once.py')
          s=p.read_text(encoding='utf-8')
          redundant='    ("MANUSCRIPT_REV6_ANON_2026-08-11.tex.gz.b64.part", "MANUSCRIPT_REV7_ANON_2026-08-11.tex.gz.b64.part"),\n'
          if s.count(redundant) != 2:
              raise SystemExit(f'expected two redundant snapshot-prefix assertions, found {s.count(redundant)}')
          p.write_text(s.replace(redundant,''), encoding='utf-8')
          PY
          python tools/rev7_canonicalize_once.py
      - name: Verify exact Rev7 recovery
        run: |
          python tools/extract_manuscript_baseline.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('experiments/01-vanishing-absorber/MANUSCRIPT_CURRENT.tex')
          b=p.read_bytes()
          assert hashlib.sha256(b).hexdigest() == '9c7fa95eb714b32839760d47f7277aaad795589c44012e2324566b6e6cb9d2f8'
          assert len(b) == 75182
          assert len(b.decode().splitlines()) == 963
          print('PASS: permanent extractor reconstructs exact Rev7 source')
          PY
      - name: Run privacy and preservation self-checks
        run: |
          python tools/check_privacy_policy.py
          python tools/check_manuscript_preservation.py \
            --candidate experiments/01-vanishing-absorber/MANUSCRIPT_REV7_ANON_2026-08-11.tex \
            --manifest experiments/01-vanishing-absorber/MANUSCRIPT_BASELINE.json
      - name: Commit pointer-only canonicalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md README.md tools/extract_manuscript_baseline.py
          git add experiments/01-vanishing-absorber/CURRENT_STATE_LIVE.md
          git add experiments/01-vanishing-absorber/MANUSCRIPT_BASELINE.json
          git add experiments/01-vanishing-absorber/MANUSCRIPT_BASELINE.md
          git add experiments/01-vanishing-absorber/MANUSCRIPT_CURRENT.md
          git diff --cached --exit-code -- experiments/01-vanishing-absorber/MANUSCRIPT_REV7_ANON_2026-08-11.tex
          git commit -m 'Make anonymous Rev7 the canonical recovery baseline'
          git push
