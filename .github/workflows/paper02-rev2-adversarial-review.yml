name: Paper 02 Rev2 adversarial review

on:
  push:
    branches:
      - agent/publication-mining-roadmap
    paths:
      - 'experiments/01-vanishing-absorber/tools/review_paper02_rev2.py'
      - 'experiments/01-vanishing-absorber/PAPER02_MANUSCRIPT_REV2_ANON_2026-08-15.tex'
      - 'experiments/01-vanishing-absorber/numerics/results/paper02_same_frequency_hidden_risk_summary.json'
      - '.github/workflows/paper02-rev2-adversarial-review.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies if statistical result must be regenerated
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Ensure same-frequency result exists
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          mkdir -p results
          if [ ! -f results/paper02_same_frequency_hidden_risk_summary.json ]; then
            python paper02_same_frequency_hidden_risk.py \
              --output-csv results/paper02_same_frequency_hidden_risk.csv \
              --output-summary results/paper02_same_frequency_hidden_risk_summary.json
          fi
      - name: Generate adversarial review
        working-directory: experiments/01-vanishing-absorber
        run: python tools/review_paper02_rev2.py
      - name: Persist review and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/01-vanishing-absorber/PAPER02_REV2_ADVERSARIAL_REVIEW_2026-08-15.md
          git add experiments/01-vanishing-absorber/numerics/results/paper02_same_frequency_hidden_risk_summary.json
          git add experiments/01-vanishing-absorber/numerics/results/paper02_same_frequency_hidden_risk.csv
          if git diff --cached --quiet; then
            echo 'Review already current.'
          else
            git commit -m 'Adversarially review Paper 02 Rev2'
            git push
          fi
