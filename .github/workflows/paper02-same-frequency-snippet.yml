name: Paper 02 same-frequency manuscript snippet

on:
  push:
    branches:
      - agent/publication-mining-roadmap
    paths:
      - 'experiments/01-vanishing-absorber/numerics/paper02_generate_same_frequency_snippet.py'
      - '.github/workflows/paper02-same-frequency-snippet.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Ensure statistical result exists
        working-directory: experiments/01-vanishing-absorber/numerics
        run: |
          mkdir -p results
          if [ ! -f results/paper02_same_frequency_hidden_risk_summary.json ]; then
            python paper02_same_frequency_hidden_risk.py \
              --output-csv results/paper02_same_frequency_hidden_risk.csv \
              --output-summary results/paper02_same_frequency_hidden_risk_summary.json
          fi
      - name: Generate manuscript snippet from checked result
        working-directory: experiments/01-vanishing-absorber/numerics
        run: python paper02_generate_same_frequency_snippet.py
      - name: Persist result and snippet
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/01-vanishing-absorber/numerics/results/paper02_same_frequency_hidden_risk.csv
          git add experiments/01-vanishing-absorber/numerics/results/paper02_same_frequency_hidden_risk_summary.json
          git add experiments/01-vanishing-absorber/PAPER02_SAME_FREQUENCY_STATISTICAL_SNIPPET.tex
          if git diff --cached --quiet; then
            echo 'Result and snippet already current.'
          else
            git commit -m 'Record same-frequency statistical ordering'
            git push
          fi
