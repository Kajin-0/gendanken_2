name: Update AGENTS Rev6 pointer once

on:
  push:
    paths:
      - '.github/workflows/rev6-agents-pointer-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrow Rev6 AGENTS edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('AGENTS.md')
          t = p.read_text()

          edits = [
              ('anonymous Rev. 5 working theory manuscript', 'anonymous Rev. 6 working theory manuscript'),
              ('HgCdTe is the leading conditional worked example', 'HgCdTe is a conditional scaling/stress example'),
              ('the anonymous 21-page Rev. 5, validated against the previous Rev. 4 baseline', 'the anonymous 22-page Rev. 6, validated against the previous Rev. 5 baseline'),
              ('The immutable Rev. 5 source is stored inside the repository', 'The immutable Rev. 6 source is stored inside the repository'),
              ('**REV. 5 submission blocker:**', '**REV. 6 submission blockers:**'),
              ('retained in Rev. 5:** this four-color null', 'retained in Rev. 6:** this four-color null'),
              ('## 6. Rev. 4/5 mathematical boundary conditions', '## 6. Rev. 4/5/6 mathematical boundary conditions'),
              ('Rev. 5 retains the exact conditional transport law', 'Rev. 6 retains the exact conditional transport law'),
              ('Rev. 5 retains the deliberately independent residual-error stresses', 'Rev. 6 retains the deliberately independent residual-error stresses'),
              ('preserve the exact anonymous 19-page Rev. 4 source', 'preserve the exact anonymous 22-page Rev. 6 source'),
          ]
          for old, new in edits:
              if old not in t:
                  raise SystemExit('missing AGENTS text: ' + old)
              t = t.replace(old, new, 1)

          marker = '- `experiments/01-vanishing-absorber/CURRENT_STATE_LIVE.md`\n'
          addition = '- `experiments/01-vanishing-absorber/REV6_ADVERSARIAL_CORRECTIONS_2026-08-11.md`\n- `experiments/01-vanishing-absorber/MANUSCRIPT_REV6_PRESERVATION_REPORT_2026-08-11.md`\n'
          if addition not in t:
              if marker not in t: raise SystemExit('missing current-state list marker')
              t = t.replace(marker, marker + addition, 1)

          read_marker = '5. `experiments/01-vanishing-absorber/CURRENT_STATE_LIVE.md`\n'
          read_add = '6. `experiments/01-vanishing-absorber/REV6_ADVERSARIAL_CORRECTIONS_2026-08-11.md`\n'
          if read_add not in t:
              if read_marker not in t: raise SystemExit('missing reading-order marker')
              t = t.replace(read_marker, read_marker + read_add, 1)

          rank_line = 'A second mode must be statistically resolved before roots are interpreted.'
          rank_add = ('A second mode must be statistically resolved before roots are interpreted.\n\n'
                      '**REV. 6 qualification:** rank detection is only the first threshold. A resolved second mode must also have sufficiently precise recurrence parameters before physical root-law discrimination. For `P=W_1/W_0=q_1q_2`, the optimistic independent equal-significance limit gives `sigma_P/|P| ~ sqrt(2)/Z`, so `Z=3` still implies about 47.1% relative product uncertainty. Operational order: **rank detection -> parameter resolution -> physical-law discrimination**. Algebraic branch immunity is not statistical robustness.')
          if '**REV. 6 qualification:** rank detection' not in t:
              if rank_line not in t: raise SystemExit('missing rank marker')
              t = t.replace(rank_line, rank_add, 1)

          weight_line = 'A linear field therefore requires **third differences / six colors** for exact polynomial annihilation at the singular DC/no-recombination point. Do not apply the five-color theorem there.'
          weight_add = weight_line + '\n\n**REV. 6 interpretation lock:** prescribed one-dimensional `E_w(z)` is an effective observation-operator surrogate, not a generic self-consistent finite-pixel electrostatic geometry. Real finite-electrode nonuniformity generally requires multidimensional electrostatics and lateral trajectories.'
          if '**REV. 6 interpretation lock:**' not in t:
              if weight_line not in t: raise SystemExit('missing weighting marker')
              t = t.replace(weight_line, weight_add, 1)

          hg_line = 'These are conditional theory predictions, not calibrated forecasts for an existing detector.'
          hg_add = hg_line + '\n\n**REV. 6 HgCdTe normalization:** the previously reported finite-width target and resource budget are the conditional `xi=1` baseline of the force-partition sensitivity stress, not generic HgCdTe material specifications. The manuscript now varies `xi` explicitly.'
          if '**REV. 6 HgCdTe normalization:**' not in t:
              if hg_line not in t: raise SystemExit('missing HgCdTe marker')
              t = t.replace(hg_line, hg_add, 1)

          p.write_text(t)
          PY
          git diff --check
          git diff -- AGENTS.md
      - name: Commit AGENTS update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md
          git commit -m 'Update AGENTS recovery protocol for Rev6'
          git push
