name: Update AGENTS Rev6 pointer once

on:
  push:
    paths:
      - '.github/workflows/rev6-agents-pointer-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified Rev6 AGENTS patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/rev6_agents_patch.py
          python /tmp/rev6_agents_patch.py
          git diff --check
          git diff -- AGENTS.md
      - name: Commit AGENTS update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md
          git commit -m 'Update AGENTS recovery protocol for Rev6'
          git push
